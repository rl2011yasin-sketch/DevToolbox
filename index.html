<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevToolbox — Visual Studio Code</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<style>
/* ═══════════ VS CODE THEME ═══════════ */
:root,[data-theme="dark"]{
  --titleBg:#3c3c3c;--titleFg:#cccccc;--titleFgDim:#969696;
  --actBg:#333;--actFg:#fff;--actFgDim:rgba(255,255,255,.4);
  --sideBg:#252526;--sideHeaderFg:#bbb;--sideFg:#ccc;--sideFgDim:#969696;
  --edBg:#1e1e1e;--edFg:#d4d4d4;
  --tabActive:#1e1e1e;--tabInactive:#2d2d2d;--tabActiveFg:#fff;--tabInactiveFg:#969696;
  --panelHeaderBg:#252526;--statusBg:#007acc;--statusFg:#fff;
  --inputBg:#3c3c3c;--inputFg:#ccc;--inputBorder:#3c3c3c;
  --btnBg:#0e639c;--btnHover:#1177bb;--btnFg:#fff;
  --focusBorder:#007fd4;--listHover:#2a2d2e;--listActive:#094771;
  --border:#3c3c3c;--borderLight:#2d2d2d;--accent:#007acc;
  --success:#4ec9b0;--warn:#dcdcaa;--danger:#f48771;
  --keyword:#569cd6;--string:#ce9178;--comment:#6a9955;--number:#b5cea8;
  --variable:#9cdcfe;
}
[data-theme="light"]{
  --titleBg:#ddd;--titleFg:#333;--titleFgDim:#6c6c6c;
  --actBg:#2c2c2c;--actFg:#fff;--actFgDim:rgba(255,255,255,.4);
  --sideBg:#f3f3f3;--sideHeaderFg:#6c6c6c;--sideFg:#333;--sideFgDim:#6c6c6c;
  --edBg:#fff;--edFg:#333;
  --tabActive:#fff;--tabInactive:#ececec;--tabActiveFg:#333;--tabInactiveFg:#6c6c6c;
  --panelHeaderBg:#f3f3f3;--statusBg:#007acc;--statusFg:#fff;
  --inputBg:#fff;--inputFg:#333;--inputBorder:#cecece;
  --btnBg:#007acc;--btnHover:#0062a3;--btnFg:#fff;
  --focusBorder:#0090f1;--listHover:#e8e8e8;--listActive:#0060c0;
  --border:#ddd;--borderLight:#ececec;--accent:#007acc;
  --success:#2e7d32;--warn:#b08800;--danger:#c53636;
  --keyword:#0000ff;--string:#a31515;--comment:#008000;--number:#098658;
  --variable:#001080;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:13px;color:var(--edFg);background:var(--edBg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.vscode{display:flex;flex-direction:column;height:100vh}

/* ERROR BANNER */
#errorBanner{
  display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#c53636;color:#fff;padding:12px 20px;font-size:13px;
  font-family:monospace;border-bottom:2px solid #fff;
}
#errorBanner.show{display:block}

/* TITLE BAR */
.title-bar{height:30px;background:var(--titleBg);color:var(--titleFg);display:flex;align-items:center;justify-content:space-between;padding:0 0 0 8px;font-size:12px;flex-shrink:0;user-select:none}
.title-left{display:flex;align-items:center;gap:12px}
.title-logo{font-weight:600;font-size:12px;padding:0 6px}
.menu-items{display:flex;gap:2px}
.menu-items span{padding:3px 8px;border-radius:3px;cursor:pointer}
.menu-items span:hover{background:rgba(255,255,255,.08)}
.title-center{flex:1;text-align:center;color:var(--titleFgDim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.title-right{display:flex}
.wc-btn{width:46px;height:30px;color:var(--titleFg);font-size:12px;display:grid;place-items:center}
.wc-btn:hover{background:rgba(255,255,255,.1)}
.wc-btn.close:hover{background:#e81123;color:#fff}

/* BODY */
.body{flex:1;display:flex;min-height:0}

/* ACTIVITY BAR */
.activity-bar{width:48px;background:var(--actBg);display:flex;flex-direction:column;align-items:center;padding-top:4px;flex-shrink:0}
.activity-icon{width:48px;height:48px;display:grid;place-items:center;color:var(--actFgDim);position:relative;transition:color .1s}
.activity-icon:hover{color:var(--actFg)}
.activity-icon.active{color:var(--actFg)}
.activity-icon.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--actFg)}
.activity-bottom{margin-top:auto;margin-bottom:4px}

/* SIDEBAR */
.side-bar{width:240px;background:var(--sideBg);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--borderLight);overflow:hidden}
.side-bar-header{padding:10px 20px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--sideHeaderFg);text-transform:uppercase;user-select:none}
.side-bar-body{flex:1;overflow-y:auto}
.folder-header{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--sideFg);cursor:pointer;user-select:none}
.folder-header:hover{background:var(--listHover)}
.chevron{font-size:9px;color:var(--sideFgDim)}
.folder-name{flex:1}
.folder-actions{opacity:0;font-size:12px;color:var(--sideFgDim)}
.folder-header:hover .folder-actions{opacity:1}
.file-tree{padding:2px 0}
.file-item{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 30px;font-size:13px;color:var(--sideFg);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item:hover{background:var(--listHover)}
.file-item.active{background:var(--listActive);color:#fff}
.file-icon{width:16px;height:16px;display:grid;place-items:center;font-size:9px;font-weight:800;border-radius:2px;color:#111;flex-shrink:0;background:#f7df1e}

/* WORKBENCH */
.workbench{flex:1;display:flex;flex-direction:column;min-width:0}
.editor-area{flex:1;background:var(--edBg);display:flex;flex-direction:column;min-height:0}

/* TABS */
.tabs{height:35px;background:var(--tabInactive);display:flex;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--borderLight)}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;height:100%;font-size:13px;color:var(--tabInactiveFg);background:var(--tabInactive);border-right:1px solid var(--borderLight);cursor:pointer;position:relative;min-width:140px;max-width:220px;flex-shrink:0;user-select:none}
.tab:hover{background:var(--tabActive)}
.tab.active{background:var(--tabActive);color:var(--tabActiveFg)}
.tab.active::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--accent)}
.tab-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-close{width:18px;height:18px;display:grid;place-items:center;border-radius:3px;font-size:11px;color:var(--tabInactiveFg);opacity:0}
.tab:hover .tab-close,.tab.active .tab-close{opacity:1}
.tab-close:hover{background:rgba(255,255,255,.15);color:var(--edFg)}

/* BREADCRUMBS */
.breadcrumbs{height:22px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sideFgDim);background:var(--edBg);flex-shrink:0;user-select:none;border-bottom:1px solid var(--borderLight)}
.breadcrumbs .sep{opacity:.5}
.breadcrumbs .crumb{cursor:pointer}
.breadcrumbs .crumb:hover{color:var(--edFg)}

/* EDITOR */
.editor-body{flex:1;display:flex;min-height:0;position:relative}
.editor-content{flex:1;overflow:auto;background:var(--edBg);color:var(--edFg);position:relative}
.editor-content::-webkit-scrollbar{width:10px}
.editor-content::-webkit-scrollbar-thumb{background:rgba(121,121,121,.4)}
.editor-content::-webkit-scrollbar-thumb:hover{background:rgba(121,121,121,.7)}
.minimap{width:80px;background:var(--edBg);border-left:1px solid var(--borderLight);position:relative;overflow:hidden;flex-shrink:0;opacity:.6}
.minimap-lines{padding:6px;display:flex;flex-direction:column;gap:3px}
.minimap-lines span{height:2px;border-radius:1px;background:var(--sideFgDim);opacity:.5}
.minimap-lines span:nth-child(odd){width:70%;background:var(--keyword)}
.minimap-lines span:nth-child(3n){width:85%;background:var(--string)}
.minimap-lines span:nth-child(5n){width:45%;background:var(--comment)}

/* WELCOME */
.welcome{max-width:720px;margin:0 auto;padding:60px 40px;color:var(--sideFg)}
.welcome h1{font-size:32px;font-weight:300;color:var(--edFg);margin-bottom:8px}
.welcome h1 span{color:var(--accent);font-weight:500}
.welcome-sub{color:var(--sideFgDim);font-size:13px;margin-bottom:40px}
.welcome-section{margin-bottom:32px}
.welcome-section h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sideFgDim);margin-bottom:12px}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.welcome-link{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sideBg);border:1px solid transparent;border-radius:3px;color:var(--edFg);font-size:13px;cursor:pointer;text-align:left;transition:background .1s,border-color .1s}
.welcome-link:hover{background:var(--listHover);border-color:var(--focusBorder)}
.welcome-link .wi{font-size:14px;opacity:.9}
.welcome-hint{font-size:11px;color:var(--sideFgDim);margin-top:8px;padding:8px 12px;background:var(--sideBg);border-left:2px solid var(--accent);border-radius:2px}
kbd{display:inline-block;padding:1px 6px;font-family:'SF Mono',Monaco,monospace;font-size:10px;background:var(--inputBg);color:var(--inputFg);border-radius:3px;border:1px solid var(--border)}

/* PANEL */
.panel{height:200px;background:var(--panelHeaderBg);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.panel.hidden{display:none}
.panel-header{height:35px;background:var(--panelHeaderBg);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-tabs{display:flex;gap:20px;height:100%}
.panel-tab{display:flex;align-items:center;font-size:11px;font-weight:500;letter-spacing:.05em;color:var(--sideFgDim);cursor:pointer;position:relative;padding:0 2px}
.panel-tab:hover{color:var(--edFg)}
.panel-tab.active{color:var(--edFg)}
.panel-tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--accent)}
.panel-actions{display:flex;gap:4px}
.panel-btn{width:24px;height:24px;display:grid;place-items:center;border-radius:3px;color:var(--sideFgDim);font-size:12px}
.panel-btn:hover{background:var(--listHover);color:var(--edFg)}
.panel-body{flex:1;overflow:auto;background:var(--edBg)}
.terminal{padding:8px 12px;font-family:'SF Mono',Monaco,Consolas,'Courier New',monospace;font-size:12px;line-height:1.5;color:var(--edFg);min-height:100%}
.term-line{white-space:pre-wrap;word-break:break-all}
.term-prompt{color:var(--success);font-weight:700}
.term-path{color:var(--variable)}
.term-cmd{color:var(--edFg)}
.term-dim{color:var(--sideFgDim)}
.term-success{color:var(--success)}
.term-warn{color:var(--warn)}
.term-error{color:var(--danger)}

/* STATUS BAR */
.status-bar{height:22px;background:var(--statusBg);color:var(--statusFg);display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:12px;flex-shrink:0;user-select:none}
.status-left,.status-right{display:flex;height:100%}
.status-center{flex:1}
.status-item{display:flex;align-items:center;gap:4px;padding:0 8px;height:100%;font-size:12px;color:inherit;white-space:nowrap}
button.status-item:hover{background:rgba(255,255,255,.12)}
.theme-btn{border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15)}

/* TOOL UI */
.tool-view{padding:24px;max-width:900px;margin:0 auto}
.tool-view.hidden{display:none}
.tool-header{padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--borderLight)}
.tool-header h2{font-size:15px;font-weight:600;color:var(--edFg);margin-bottom:4px}
.tool-header p{font-size:12px;color:var(--sideFgDim)}
.card{background:var(--sideBg);border:1px solid var(--borderLight);border-radius:3px;padding:20px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--sideFgDim);font-weight:500}
input[type="text"],input[type="number"],textarea,select{width:100%;padding:6px 10px;background:var(--inputBg);color:var(--inputFg);border:1px solid var(--inputBorder);border-radius:2px;font-size:13px;font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--focusBorder)}
textarea{resize:vertical;min-height:100px;font-family:'SF Mono',Monaco,monospace;font-size:12px}
.btn{padding:6px 14px;border-radius:2px;border:1px solid transparent;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;cursor:pointer}
.btn-primary{background:var(--btnBg);color:var(--btnFg)}
.btn-primary:hover{background:var(--btnHover)}
.btn-secondary{background:var(--inputBg);color:var(--edFg);border-color:var(--border)}
.btn-secondary:hover{background:var(--listHover)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.output-row{display:flex;gap:8px}
.output-field{flex:1;font-family:'SF Mono',Monaco,monospace;font-size:14px}
.strength-meter{height:4px;background:var(--border);overflow:hidden;margin:14px 0 6px;border-radius:2px}
.strength-meter > div{height:100%;width:0%;transition:width .3s,background .3s}
.strength-text{font-size:12px;color:var(--sideFgDim)}
.strength-text strong{color:var(--edFg)}
.options-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}
.option{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--inputBg);border:1px solid var(--border);border-radius:2px;cursor:pointer;font-size:12px}
.option input{accent-color:var(--accent)}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.swatch{aspect-ratio:3/4;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;transition:transform .15s;border:1px solid var(--border)}
.swatch:hover{transform:translateY(-2px)}
.swatch span{font-family:'SF Mono',monospace;font-size:10px;font-weight:600;background:rgba(0,0,0,.5);color:#fff;padding:2px 6px;border-radius:2px;align-self:flex-start}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:14px 0}
.stat{padding:12px;background:var(--inputBg);border:1px solid var(--border);border-radius:2px;text-align:center}
.stat-value{font-size:20px;font-weight:700;color:var(--edFg)}
.stat-label{font-size:10px;color:var(--sideFgDim);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.hash-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borderLight)}
.hash-row:last-child{border-bottom:none}
.hash-label{width:80px;font-size:11px;font-weight:700;color:var(--keyword);flex-shrink:0}
.hash-value{flex:1;font-family:'SF Mono',monospace;font-size:11px;word-break:break-all}
.icon-btn{width:28px;height:28px;border-radius:2px;border:1px solid var(--border);background:var(--inputBg);color:var(--edFg);display:grid;place-items:center;flex-shrink:0;font-size:12px;cursor:pointer}
.icon-btn:hover{background:var(--listHover)}
.conv-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.conv-swap{padding:6px 10px;background:var(--inputBg);border:1px solid var(--border);border-radius:2px;color:var(--edFg);cursor:pointer;margin-bottom:4px}
.conv-swap:hover{background:var(--listHover)}
.toast{position:fixed;bottom:40px;right:20px;background:var(--panelHeaderBg);border:1px solid var(--border);color:var(--edFg);padding:10px 16px;border-radius:3px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:all .25s;z-index:1000;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(121,121,121,.4)}
::-webkit-scrollbar-thumb:hover{background:rgba(121,121,121,.7)}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:700px){
  .side-bar{display:none}
  .minimap{display:none}
  .menu-items{display:none}
  .status-right > .status-item:nth-child(n+5){display:none}
}
</style>
</head>
<body>

<div id="errorBanner"></div>

<div class="vscode">
  <div class="title-bar">
    <div class="title-left">
      <div class="title-logo">🧰 DevToolbox</div>
      <div class="menu-items">
        <span>File</span><span>Edit</span><span>Selection</span><span>View</span>
        <span>Go</span><span>Run</span><span>Terminal</span><span>Help</span>
      </div>
    </div>
    <div class="title-center" id="titleCenter">Welcome — DevToolbox</div>
    <div class="title-right">
      <button class="wc-btn" title="Minimize">─</button>
      <button class="wc-btn" title="Maximize">□</button>
      <button class="wc-btn close" title="Close">✕</button>
    </div>
  </div>

  <div class="body">
    <div class="activity-bar">
      <button class="activity-icon active" data-panel="explorer" title="Explorer">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7l3-3h5l2 2h8v14H3z"/></svg>
      </button>
      <button class="activity-icon" data-panel="search" title="Search">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button class="activity-icon" data-panel="source" title="Source Control">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 8v8M8 6h6a4 4 0 014 4"/></svg>
      </button>
      <button class="activity-icon" data-panel="debug" title="Run and Debug">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="activity-icon" data-panel="extensions" title="Extensions">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <div class="activity-bottom">
        <button class="activity-icon" data-panel="settings" title="Settings">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <div class="side-bar">
      <div class="side-bar-header" id="sideBarHeader">EXPLORER</div>
      <div class="side-bar-body">
        <div class="folder-header">
          <span class="chevron">▾</span>
          <span class="folder-name">DEVTOOLBOX</span>
          <span class="folder-actions">＋ ⟳</span>
        </div>
        <div class="file-tree" id="fileTree"></div>
      </div>
    </div>

    <div class="workbench">
      <div class="editor-area">
        <div class="tabs" id="tabs"></div>
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div class="editor-body">
          <div class="editor-content" id="editorContent"></div>
          <div class="minimap"><div class="minimap-lines"></div></div>
        </div>
      </div>

      <div class="panel" id="panel">
        <div class="panel-header">
          <div class="panel-tabs">
            <span class="panel-tab active">TERMINAL</span>
            <span class="panel-tab">PROBLEMS</span>
            <span class="panel-tab">OUTPUT</span>
            <span class="panel-tab">DEBUG CONSOLE</span>
          </div>
          <div class="panel-actions">

<script>
/* ═══════════════════════════════════════════════════════════
   DEVTOOLBOX — ALL-IN-ONE SCRIPT
   No modules. No imports. No external JS files.
   ═══════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ─── GLOBAL ERROR HANDLER ─── */
  function showError(msg) {
    var banner = document.getElementById('errorBanner');
    if (banner) {
      banner.textContent = '⚠ ' + msg;
      banner.classList.add('show');
    }
    console.error('[DevToolbox]', msg);
  }

  window.addEventListener('error', function (e) {
    showError('Script error: ' + (e.message || 'unknown') + ' — check F12 Console');
  });

  /* ─── UTILS ─── */
  var toastEl = null;
  var toastTimer = null;

  function showToast(message, type) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = message;
    toastEl.className = 'toast show ' + (type || 'success');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  function copyText(text) {
    if (!text) return;
    function done() { showToast('Copied!', 'success'); log('Copied ' + text.length + ' characters', 'success'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { legacyCopy(text); done(); });
    } else {
      legacyCopy(text); done();
    }
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ─── TERMINAL LOG ─── */
  function log(message, type) {
    var term = document.getElementById('terminal');
    if (!term) return;
    var colors = {
      dim: 'var(--sideFgDim)', success: 'var(--success)',
      warn: 'var(--warn)', error: 'var(--danger)', info: 'var(--variable)'
    };
    var line = document.createElement('div');
    line.className = 'term-line';
    var color = colors[type] || colors.dim;
    line.innerHTML = '<span class="term-prompt">➜</span> ' +
      '<span class="term-path">~/devtoolbox</span> ' +
      '<span style="color:' + color + '">' + escapeHtml(message) + '</span>';
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
  }

  function termWrite(html) {
    var term = document.getElementById('terminal');
    if (!term) return;
    var line = document.createElement('div');
    line.className = 'term-line';
    line.innerHTML = html;
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
  }

  /* ═══════════════════════════════════════════════════════════
     TOOLS REGISTRY
     ═══════════════════════════════════════════════════════════ */
  var TOOLS_META = [
    { id: 'password', file: 'password.js', label: 'Password Generator', icon: '🔐' },
    { id: 'qr',       file: 'qr.js',       label: 'QR Code',            icon: '📱' },
    { id: 'color',    file: 'color.js',    label: 'Color Palette',      icon: '🎨' },
    { id: 'text',     file: 'text.js',     label: 'Text Tools',         icon: '✍️' },
    { id: 'json',     file: 'json.js',     label: 'JSON Formatter',     icon: '{ }' },
    { id: 'base64',   file: 'base64.js',   label: 'Base64',             icon: '🔤' },
    { id: 'hash',     file: 'hash.js',     label: 'Hash Generator',     icon: '#️⃣' },
    { id: 'units',    file: 'units.js',    label: 'Unit Converter',     icon: '📏' }
  ];

  var TOOLS = {};  // id → render function

  /* ─── TOOL: PASSWORD ─── */
  var PW_SETS = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };
  function pwRnd(max) {
    var buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] % max;
  }
  function pwGen(length, opts) {
    var pool = '', req = [];
    if (opts.lower)   { pool += PW_SETS.lower;   req.push(PW_SETS.lower); }
    if (opts.upper)   { pool += PW_SETS.upper;   req.push(PW_SETS.upper); }
    if (opts.numbers) { pool += PW_SETS.numbers; req.push(PW_SETS.numbers); }
    if (opts.symbols) { pool += PW_SETS.symbols; req.push(PW_SETS.symbols); }
    if (!pool) return '';
    var chars = req.map(function (s) { return s[pwRnd(s.length)]; });
    while (chars.length < length) chars.push(pool[pwRnd(pool.length)]);
    for (var i = chars.length - 1; i > 0; i--) {
      var j = pwRnd(i + 1);
      var tmp = chars[i]; chars[i] = chars[j]; chars[j] = tmp;
    }
    return chars.join('');
  }
  function pwStrength(pw, poolSize) {
    if (!pw || !poolSize) return { s: 0, l: '—', c: 'var(--sideFgDim)' };
    var e = pw.length * Math.log2(poolSize);
    if (e < 40) return { s: 25, l: 'Weak', c: 'var(--danger)' };
    if (e < 60) return { s: 50, l: 'Fair', c: 'var(--warn)' };
    if (e < 80) return { s: 75, l: 'Strong', c: 'var(--success)' };
    return { s: 100, l: 'Very strong', c: 'var(--success)' };
  }

  TOOLS.password = function (c) {
    c.innerHTML =
      '<header class="tool-header"><h2>🔐 Password Generator</h2><p>Cryptographically secure passwords generated entirely in your browser.</p></header>' +
      '<div class="card">' +
        '<div class="output-row">' +
          '<input type="text" id="pw-out" class="output-field" readonly placeholder="Click Generate" />' +
          '<button class="btn btn-secondary" id="pw-copy">📋 Copy</button>' +
        '</div>' +
        '<div class="strength-meter"><div id="strength-fill"></div></div>' +
        '<p class="strength-text" id="strength-text">—</p>' +
        '<div class="field" style="margin-top:18px">' +
          '<label>Length: <strong id="len-val">20</strong></label>' +
          '<input type="range" id="len" min="4" max="64" value="20" style="accent-color:var(--accent)" />' +
        '</div>' +
        '<div class="options-grid">' +
          '<label class="option"><input type="checkbox" id="opt-lower" checked /> Lowercase</label>' +
          '<label class="option"><input type="checkbox" id="opt-upper" checked /> Uppercase</label>' +
          '<label class="option"><input type="checkbox" id="opt-numbers" checked /> Numbers</label>' +
          '<label class="option"><input type="checkbox" id="opt-symbols" checked /> Symbols</label>' +
        '</div>' +
        '<button class="btn btn-primary" id="pw-gen" style="width:100%">⚡ Generate Password</button>' +
      '</div>';

    var $ = function (s) { return c.querySelector(s); };
    var out = $('#pw-out'), fill = $('#strength-fill'), sText = $('#strength-text'), len = $('#len');

    function opts() {
      return {
        lower: $('#opt-lower').checked, upper: $('#opt-upper').checked,
        numbers: $('#opt-numbers').checked, symbols: $('#opt-symbols').checked
      };
    }
    function poolSize() {
      var o = opts();
      return (o.lower ? 26 : 0) + (o.upper ? 26 : 0) + (o.numbers ? 10 : 0) + (o.symbols ? PW_SETS.symbols.length : 0);
    }
    function update() {
      var st = pwStrength(out.value, poolSize());
      fill.style.width = st.s + '%';
      fill.style.background = st.c;
      sText.innerHTML = st.l === '—' ? '—' : 'Strength: <strong style="color:' + st.c + '">' + st.l + '</strong>';
    }
    function generate() {
      if (!poolSize()) { showToast('Select at least one character set', 'error'); return; }
      out.value = pwGen(parseInt(len.value, 10), opts());
      update();
      log('Generated password (' + len.value + ' chars)', 'success');
    }
    len.addEventListener('input', function () { $('#len-val').textContent = len.value; });
    $('#pw-gen').addEventListener('click', generate);
    $('#pw-copy').addEventListener('click', function () {
      if (!out.value) return showToast('Generate a password first', 'error');
      copyText(out.value);
    });
    generate();
  };

  /* ─── TOOL: QR (lazy-load, graceful fallback) ─── */
  TOOLS.qr = function (c) {
    c.innerHTML =
      '<header class="tool-header"><h2>📱 QR Code Generator</h2><p>Turn any text or URL into a downloadable QR code.</p></header>' +
      '<div class="card">' +
        '<div id="qr-status" style="padding:10px;background:var(--inputBg);border-radius:4px;font-size:12px;color:var(--sideFgDim);margin-bottom:14px">⏳ Loading QR library…</div>' +
        '<div class="field"><label>Text or URL</label><input type="text" id="qr-text" value="https://github.com" /></div>' +
        '<div class="field"><label>Size: <strong id="size-val">300</strong>px</label>' +
          '<input type="range" id="qr-size" min="150" max="600" step="50" value="300" style="accent-color:var(--accent)" />' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="qr-gen" disabled>✨ Generate</button>' +
          '<button class="btn btn-secondary" id="qr-dl">⬇️ Download PNG</button>' +
        '</div>' +
        '<div style="display:flex;justify-content:center;padding:16px;margin-top:12px">' +
          '<canvas id="qr-canvas" style="background:#fff;padding:12px;border-radius:2px" width="300" height="300"></canvas>' +
        '</div>' +
      '</div>';

    var $ = function (s) { return c.querySelector(s); };
    var text = $('#qr-text'), size = $('#qr-size'), canvas = $('#qr-canvas');
    var statusEl = $('#qr-status'), genBtn = $('#qr-gen');
    var libReady = false;

    // Lazy-load QR with 3 CDN fallbacks + timeout
    (function loadQR() {
      if (window.QRCode && window.QRCode.toCanvas) { onReady(); return; }
      var urls = [
        'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js',
        'https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'
      ];
      var i = 0;
      function next() {
        if (i >= urls.length) return onFail();
        var url = urls[i++];
        var s = document.createElement('script');
        s.src = url; s.async = true;
        var timer = setTimeout(function () { s.remove(); next(); }, 5000);
        s.onload = function () {
          clearTimeout(timer);
          if (window.QRCode && window.QRCode.toCanvas) onReady();
          else next();
        };
        s.onerror = function () { clearTimeout(timer); s.remove(); next(); };
        document.head.appendChild(s);
      }
      next();
    })();

    function onReady() {
      libReady = true;
      statusEl.textContent = '✓ QR library ready';
      statusEl.style.color = 'var(--success)';
      genBtn.disabled = false;
      log('QR library loaded', 'success');
      generate();
    }
    function onFail() {
      statusEl.innerHTML = '✗ Could not load QR library — CDN is blocked in your network.<br>' +
        '<span style="font-size:11px;opacity:.7">This tool needs internet. Other tools work fine.</span>';
      statusEl.style.color = 'var(--danger)';
      log('QR library blocked — CDN unreachable', 'error');
    }

    function generate() {
      if (!libReady || !window.QRCode || !window.QRCode.toCanvas) return;
      if (!text.value.trim()) return;
      try {
        window.QRCode.toCanvas(canvas, text.value, {
          width: parseInt(size.value, 10), margin: 2,
          color: { dark: '#000000', light: '#ffffff' }
        }, function (err) { if (err) log('QR error: ' + err.message, 'error'); });
      } catch (e) { log('QR error: ' + e.message, 'error'); }
    }

    size.addEventListener('input', function () {
      $('#size-val').textContent = size.value;
      if (libReady) generate();
    });
    genBtn.addEventListener('click', function () { generate(); log('QR generated', 'success'); });
    $('#qr-dl').addEventListener('click', function () {
      try {
        var a = document.createElement('a');
        a.download = 'qrcode.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        log('QR downloaded', 'success');
      } catch (e) { log('Download failed: ' + e.message, 'error'); }
    });
    text.addEventListener('input', function () { if (libReady) generate(); });
  };

  /* ─── TOOL: COLOR ─── */
  function hslToHex(h, s, l) {
    l /= 100;
    var a = (s * Math.min(l, 1 - l)) / 100;
    function f(n) {
      var k = (n + h / 30) % 12;
      var color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      return Math.round(255 * color).toString(16).padStart(2, '0');
    }
    return '#' + f(0) + f(8) + f(4);
  }
  TOOLS.color = function (c) {
    c.innerHTML =
      '<header class="tool-header"><h2>🎨 Color Palette Generator</h2><p>Click any swatch to copy its HEX value.</p></header>' +
      '<div class="card">' +
        '<div class="btn-row" style="margin-top:0">' +
          '<button class="btn btn-primary" id="pal-gen">🎲 New Palette</button>' +
          '<span style="align-self:center;color:var(--sideFgDim);font-size:12px">Press Space to regenerate</span>' +
        '</div>' +
        '<div class="palette" id="palette"></div>' +
      '</div>';

    var el = c.querySelector('#palette');
    function draw() {
      el.innerHTML = '';
      var base = Math.floor(Math.random() * 360);
      for (var i = 0; i < 5; i++) {
        var h = (base + i * 40 + Math.random() * 20) % 360;
        var s = 55 + Math.floor(Math.random() * 30);
        var l = 40 + Math.floor(Math.random() * 30);
        var color = hslToHex(h, s, l);
        (function (col) {
          var sw = document.createElement('div');
          sw.className = 'swatch';
          sw.style.background = col;
          var label = document.createElement('span');
          label.textContent = col.toUpperCase();
          sw.appendChild(label);
          sw.addEventListener('click', function () { copyText(col); });
          el.appendChild(sw);
        })(color);
      }
    }
    c.querySelector('#pal-gen').addEventListener('click', function () {
      draw(); log('New palette generated', 'success');
    });
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && ['INPUT', 'TEXTAREA'].indexOf(e.target.tagName) === -1) {
        e.preventDefault(); draw();
      }
    });
    draw();
  };

  /* ─── TOOL: TEXT ─── */
  TOOLS.text = function (c) {
    c.innerHTML =
      '<header class="tool-header"><h2>✍️ Text Tools</h2><p>Convert case, count words, and clean up text — all offline.</p></header>' +
      '<div class="card">' +
        '<div class="field"><label>Your text</label><textarea id="txt" placeholder="Type or paste text here…"></textarea></div>' +
        '<div class="stats-grid">' +
          '<div class="stat"><div class="stat-value" id="s-char">0</div><div class="stat-label">Characters</div></div>' +
          '<div class="stat"><div class="stat-value" id="s-word">0</div><div class="stat-label">Words</div></div>' +
          '<div class="stat"><div class="stat-value" id="s-line">0</div><div class="stat-label">Lines</div></div>' +
          '<div class="stat"><div class="stat-value" id="s-sent">0</div><div class="stat-label">Sentences</div></div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-secondary" data-fn="upper">UPPER</button>' +
          '<button class="btn btn-secondary" data-fn="lower">lower</button>' +
          '<button class="btn btn-secondary" data-fn="title">Title</button>' +
          '<button class="btn btn-secondary" data-fn="sentence">Sentence</button>' +
          '<button class="btn btn-secondary" data-fn="camel">camelCase</button>' +
          '<button class="btn btn-secondary" data-fn="snake">snake_case</button>' +
          '<button class="btn btn-secondary" data-fn="kebab">kebab-case</button>' +
          '<button class="btn btn-secondary" data-fn="alternating">aLtErNaTiNg</button>' +
          '<button class="btn btn-secondary" data-fn="copy">📋 Copy</button>' +
        '</div>' +
      '</div>';

    var input = c.querySelector('#txt');
    var fns = {
      upper: function (t) { return t.toUpperCase(); },
      lower: function (t) { return t.toLowerCase(); },
      title: function (s) { return s.replace(/\w\S*/g, function (w) { return w[0].toUpperCase() + w.slice(1).toLowerCase(); }); },
      sentence: function (s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); },
      camel: function (s) { return s.replace(/[^a-zA-Z0-9]+(.)/g, function (_, x) { return x.toUpperCase(); }).replace(/^./, function (x) { return x.toLowerCase(); }); },
      snake: function (s) { return s.replace(/([a-z])([A-Z])/g, '$1_$2').replace(/[\s-]+/g, '_').toLowerCase(); },
      kebab: function (s) { return s.replace(/([a-z])([A-Z])/g, '$1-$2').replace(/[\s_]+/g, '-').toLowerCase(); },
      alternating: function (s) { return s.split('').map(function (ch, i) { return i % 2 ? ch.toUpperCase() : ch.toLowerCase(); }).join(''); }
    };

    function stats() {
      var t = input.value;
      c.querySelector('#s-char').textContent = t.length;
      c.querySelector('#s-word').textContent = t.trim() ? t.trim().split(/\s+/).length : 0;
      c.querySelector('#s-line').textContent = t ? t.split('\n').length : 0;
      c.querySelector('#s-sent').textContent = (t.match(/[.!?]+/g) || []).length;
    }
    input.addEventListener('input', stats);
    c.querySelectorAll('[data-fn]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var fn = btn.dataset.fn;
        if (fn === 'copy') return copyText(input.value);

  /* ─── TOOL: JSON ─── */
  TOOLS.json = function (c) {
    c.innerHTML =
      '<header class="tool-header"><h2>{ } JSON Formatter</h2><p>Format, minify and validate JSON instantly.</p></header>' +
      '<div class="card">' +
        '<div class="field"><label>Input JSON</label><textarea id="json-in" placeholder=\'{"hello": "world"}\'></textarea></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" data-act="format">✨ Format</button>' +
          '<button class="btn btn-secondary" data-act="minify">📦 Minify</button>' +
          '<button class="btn btn-secondary" data-act="clear">🗑️ Clear</button>' +
        '</div>' +
        '<div id="status" style="margin-top:14px;font-size:12px;color:var(--sideFgDim)"></div>' +
      '</div>';

    var input = c.querySelector('#json-in');
    var status = c.querySelector('#status');
    function setStatus(msg, color) { status.innerHTML = msg; status.style.color = color || 'var(--sideFgDim)'; }
    function process(action) {
      var raw = input.value.trim();
      if (!raw) return setStatus('Input is empty', 'var(--warn)');
      try {
        var parsed = JSON.parse(raw);
        if (action === 'format') {
          input.value = JSON.stringify(parsed, null, 2);
          setStatus('✓ Valid JSON — formatted', 'var(--success)');
          log('JSON formatted', 'success');

          input.value = JSON.stringify(parsed);
          setStatus('✓ Valid JSON — minified', 'var(--success)');

        setStatus('✗ Invalid JSON: ' + err.message, 'var(--danger)');
        log('JSON error: ' + err.message, 'error');
      }
    }
    c.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var a = btn.dataset.act;

        else process(a);
      });
    });
  };

  /* ─── TOOL: BASE64 ─── */
  TOOLS.base64 = function (c) {
    c.innerHTML =
      '<header class="tool-header"><h2>🔤 Base64 Encoder / Decoder</h2><p>Convert text to Base64 and back. UTF-8 safe.</p></header>' +
      '<div class="card">' +
        '<div class="field"><label>Input</label><textarea id="b-in" placeholder="Enter text or Base64…"></textarea></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="b-enc">Encode →</button>' +
          '<button class="btn btn-secondary" id="b-dec">← Decode</button>' +
          '<button class="btn btn-secondary" id="b-copy">📋 Copy</button>' +
          '<button class="btn btn-secondary" id="b-clear">🗑️ Clear</button>' +
        '</div>' +
        '<div class="field" style="margin-top:14px"><label>Result</label><textarea id="b-out" readonly></textarea></div>' +
        '<p id="b-err" style="color:var(--danger);font-size:12px;margin-top:6px"></p>' +
      '</div>';

    var input = c.querySelector('#b-in'), out = c.querySelector('#b-out'), err = c.querySelector('#b-err');

    function encode(s) {
      var bytes = new TextEncoder().encode(s);
      var bin = '';
      bytes.forEach(function (b) { bin += String.fromCharCode(b); });
      return btoa(bin);
    }
    function decode(s) {
      var bin = atob(s.trim());
      var bytes = Uint8Array.from(bin, function (ch) { return ch.charCodeAt(0); });
      return new TextDecoder().decode(bytes);
    }

    c.querySelector('#b-enc').addEventListener('click', function () {
      err.textContent = '';
      try { out.value = encode(input.value); log('Base64 encoded', 'success'); }
      catch (e) { err.textContent = e.message; }
    });
    c.querySelector('#b-dec').addEventListener('click', function () {
      err.textContent = '';
      try { out.value = decode(input.value); log('Base64 decoded', 'success'); }
      catch (e) { err.textContent = 'Invalid Base64 input'; log('Base64 decode failed', 'error'); }
    });
    c.querySelector('#b-copy').addEventListener('click', function () { if (out.value) copyText(out.value); });
    c.querySelector('#b-clear').addEventListener('click', function () {
      input.value = ''; out.value = ''; err.textContent = '';
    });
  };

  /* ─── TOOL: HASH ─── */
  TOOLS.hash = function (c) {
    c.innerHTML =
      '<header class="tool-header"><h2>#️⃣ Hash Generator</h2><p>Generate SHA hashes using Web Crypto API.</p></header>' +
      '<div class="card">' +
        '<div class="field"><label>Input text</label><textarea id="h-in" placeholder="Enter text to hash…"></textarea></div>' +
        '<div id="h-res" style="margin-top:14px"></div>' +
      '</div>';

    var input = c.querySelector('#h-in');
    var results = c.querySelector('#h-res');
    var ALGOS = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];

    function digest(algo, text) {
      var data = new TextEncoder().encode(text);
      return crypto.subtle.digest(algo, data).then(function (buf) {
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    }
    function update() {
      results.innerHTML = '';
      var text = input.value;
      if (!text) return;
      ALGOS.forEach(function (algo) {
        digest(algo, text).then(function (hash) {
          var row = document.createElement('div');
          row.className = 'hash-row';
          row.innerHTML = '<div class="hash-label">' + algo + '</div>' +
            '<div class="hash-value">' + hash + '</div>' +
            '<button class="icon-btn" title="Copy">📋</button>';
          row.querySelector('button').addEventListener('click', function () { copyText(hash); });
          results.appendChild(row);
        }).catch(function (e) { log('Hash error: ' + e.message, 'error'); });
      });
    }
    var timer;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { update(); log('Hashes calculated', 'dim'); }, 250);
    });
  };

  /* ─── TOOL: UNITS ─── */
  TOOLS.units = function (c) {
    var CONFIG = {
      Length: { units: { mm: ['Millimeter', 0.001], cm: ['Centimeter', 0.01], m: ['Meter', 1], km: ['Kilometer', 1000], in: ['Inch', 0.0254], ft: ['Foot', 0.3048], yd: ['Yard', 0.9144], mi: ['Mile', 1609.344] } },
      Mass:   { units: { mg: ['Milligram', 0.001], g: ['Gram', 1], kg: ['Kilogram', 1000], oz: ['Ounce', 28.3495], lb: ['Pound', 453.592] } },
      Temperature: { special: true, units: { C: ['Celsius'], F: ['Fahrenheit'], K: ['Kelvin'] } },
      Data:   { units: { bit: ['Bit', 0.125], B: ['Byte', 1], KB: ['Kilobyte', 1024], MB: ['Megabyte', 1048576], GB: ['Gigabyte', 1073741824], TB: ['Terabyte', 1099511627776] } }
    };

    c.innerHTML =
      '<header class="tool-header"><h2>📏 Unit Converter</h2><p>Convert length, mass, temperature & data sizes.</p></header>' +
      '<div class="card">' +
        '<div class="field"><label>Category</label><select id="cat"></select></div>' +
        '<div class="field"><label>From</label><input type="number" id="val" value="1" /><select id="from"></select></div>' +
        '<div class="conv-row"><div></div><button class="conv-swap" id="swap">⇅</button><div></div></div>' +
        '<div class="field"><label>To</label><input type="text" id="result" readonly /><select id="to"></select></div>' +
      '</div>';

    var $ = function (s) { return c.querySelector(s); };
    var cat = $('#cat'), from = $('#from'), to = $('#to'), val = $('#val'), result = $('#result');

    cat.innerHTML = Object.keys(CONFIG).map(function (k) { return '<option>' + k + '</option>'; }).join('');

    function convert(v, f, t, category) {
      var cfg = CONFIG[category];
      if (cfg.special) {
        var cv;
        if (f === 'C') cv = v;
        else if (f === 'F') cv = (v - 32) * 5 / 9;
        else cv = v - 273.15;
        if (t === 'C') return cv;
        if (t === 'F') return cv * 9 / 5 + 32;
        return cv + 273.15;
      }
      return (v * cfg.units[f][1]) / cfg.units[t][1];
    }
    function fmt(n) {
      if (!isFinite(n)) return '—';
      if (Math.abs(n) >= 1e9 || (Math.abs(n) < 1e-4 && n !== 0)) return n.toExponential(4);
      return parseFloat(n.toFixed(6)).toString();
    }
    function populate() {
      var units = CONFIG[cat.value].units;
      var opts = Object.keys(units).map(function (k) {
        return '<option value="' + k + '">' + units[k][0] + ' (' + k + ')</option>';
      }).join('');
      from.innerHTML = opts; to.innerHTML = opts;
      var keys = Object.keys(units);
      from.value = keys[0];
      to.value = keys[1] || keys[0];
      update();
    }
    function update() {
      var v = parseFloat(val.value);
      result.value = isNaN(v) ? '' : fmt(convert(v, from.value, to.value, cat.value));
    }
    cat.addEventListener('change', populate);
    from.addEventListener('change', update);
    to.addEventListener('change', update);
    val.addEventListener('input', update);
    $('#swap').addEventListener('click', function () {
      var tmp = from.value; from.value = to.value; to.value = tmp; update();
    });
    populate();
  };

  /* ═══════════════════════════════════════════════════════════
     APP / EDITOR LOGIC
     ═══════════════════════════════════════════════════════════ */
  var openTabs = {};
  var activeId = null;

  var $ = function (s) { return document.querySelector(s); };
  var fileTree = $('#fileTree');
  var tabsEl = $('#tabs');
  var editorContent = $('#editorContent');
  var breadcrumbs = $('#breadcrumbs');
  var titleCenter = $('#titleCenter');
  var statusLang = $('#statusLang');
  var panel = $('#panel');

  function buildExplorer() {
    fileTree.innerHTML = '';
    TOOLS_META.forEach(function (tool) {
      var item = document.createElement('div');
      item.className = 'file-item';
      item.dataset.id = tool.id;
      item.innerHTML = '<span class="file-icon">JS</span><span>' + tool.file + '</span>';
      item.addEventListener('click', function () { openTool(tool.id); });
      fileTree.appendChild(item);
    });
  }

  function openTool(id) {
    var meta = TOOLS_META.filter(function (t) { return t.id === id; })[0];
    if (!meta) return;

    if (openTabs[id]) return activateTab(id);

    var fn = TOOLS[id];
    if (typeof fn !== 'function') {
      log('Tool "' + id + '" is not available', 'error');
      showToast('Tool not loaded: ' + id, 'error');
      return;
    }

    // Tab
    var tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.dataset.id = id;
    tabEl.innerHTML = '<span class="file-icon">JS</span>' +
      '<span class="tab-label">' + meta.file + '</span>' +
      '<button class="tab-close" title="Close">✕</button>';
    tabEl.addEventListener('click', function (e) {
      if (e.target.classList.contains('tab-close')) closeTab(id);
      else activateTab(id);
    });
    tabsEl.appendChild(tabEl);

    // View
    var viewEl = document.createElement('div');
    viewEl.className = 'tool-view hidden';
    editorContent.appendChild(viewEl);

    openTabs[id] = { tabEl: tabEl, viewEl: viewEl, meta: meta };

    // Render
    try { fn(viewEl); }
    catch (err) {
      viewEl.innerHTML = '<div class="card" style="color:var(--danger)">Error in ' + meta.file + ': ' + (err.message || err) + '</div>';
      log('Render error: ' + err.message, 'error');
    }

    log('Opened ' + meta.file, 'success');
    activateTab(id);
  }

  function activateTab(id) {
    var entry = openTabs[id];
    if (!entry) return;

    var welcome = document.querySelector('.welcome');
    if (welcome) welcome.remove();

    Object.keys(openTabs).forEach(function (k) {
      openTabs[k].tabEl.classList.remove('active');
      openTabs[k].viewEl.classList.add('hidden');
    });

    entry.tabEl.classList.add('active');
    entry.viewEl.classList.remove('hidden');

    document.querySelectorAll('.file-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.id === id);
    });

    breadcrumbs.innerHTML = '<span class="crumb">DevToolbox</span><span class="sep">›</span>' +
      '<span class="crumb">' + entry.meta.file + '</span><span class="sep">›</span>' +
      '<span class="crumb">Preview</span>';

    titleCenter.textContent = entry.meta.file + ' — DevToolbox — Visual Studio Code';
    document.title = entry.meta.file + ' — DevToolbox';
    statusLang.textContent = 'JavaScript';
    activeId = id;
  }

  function closeTab(id) {
    var entry = openTabs[id];
    if (!entry) return;
    var wasActive = entry.tabEl.classList.contains('active');
    entry.tabEl.remove();
    entry.viewEl.remove();
    delete openTabs[id];
    log('Closed ' + entry.meta.file, 'dim');

    if (Object.keys(openTabs).length === 0) {
      showWelcome();
      breadcrumbs.innerHTML = '';
      titleCenter.textContent = 'Welcome — DevToolbox';
      document.title = 'DevToolbox — Visual Studio Code';
      activeId = null;
    } else if (wasActive) {
      var keys = Object.keys(openTabs);
      activateTab(keys[keys.length - 1]);
    }
  }

  function showWelcome() {
    var old = document.querySelector('.welcome');
    if (old) old.remove();

    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="welcome">' +
      '<h1>DevToolbox <span>for VS Code</span></h1>' +
      '<p class="welcome-sub">A modular developer toolbox — styled like your favorite editor.</p>' +
      '<div class="welcome-section"><h3>Start</h3><div class="welcome-grid">' +
        TOOLS_META.map(function (t) {
          return '<button class="welcome-link" data-open="' + t.id + '">' +
            '<span class="wi">' + t.icon + '</span><span>' + t.label + '</span></button>';
        }).join('') +
      '</div></div>' +
      '<div class="welcome-hint">💡 Type <kbd>help</kbd> in the terminal below to see all commands.</div>' +
    '</div>';

    var welcomeEl = wrap.firstElementChild;
    welcomeEl.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () { openTool(btn.dataset.open); });
    });
    editorContent.appendChild(welcomeEl);
  }

  /* ─── ACTIVITY BAR ─── */
  var PANEL_LABELS = {
    explorer: 'EXPLORER', search: 'SEARCH', source: 'SOURCE CONTROL',
    debug: 'RUN AND DEBUG', extensions: 'EXTENSIONS', settings: 'SETTINGS'
  };
  document.querySelectorAll('.activity-icon').forEach(function (icon) {
    icon.addEventListener('click', function () {
      document.querySelectorAll('.activity-icon').forEach(function (i) { i.classList.remove('active'); });
      icon.classList.add('active');
      var panelId = icon.dataset.panel;
      var h = $('#sideBarHeader');
      if (h) h.textContent = PANEL_LABELS[panelId] || panelId.toUpperCase();
      if (panelId === 'explorer') buildExplorer();
      else fileTree.innerHTML = '<div style="padding:20px;color:var(--sideFgDim);font-size:12px;text-align:center">Decorative panel.<br>Click Explorer 📁 for files.</div>';
    });
  });

  /* ─── THEME ─── */
  var themeBtn = $('#themeBtn');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    if (themeBtn) themeBtn.textContent = theme === 'dark' ? '🌙 Dark+' : '☀️ Light+';
    try { localStorage.setItem('dt-theme', theme); } catch (e) {}
  }
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      var next = cur === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      log('Theme: ' + (next === 'dark' ? 'Dark+' : 'Light+'), 'dim');
    });
    try { applyTheme(localStorage.getItem('dt-theme') || 'dark'); }
    catch (e) { applyTheme('dark'); }
  }

  /* ─── PANEL ─── */
  var panelClose = $('#panelClose');
  var panelKill = $('#panelKill');
  if (panelClose) panelClose.addEventListener('click', function () { panel.classList.toggle('hidden'); });
  if (panelKill) panelKill.addEventListener('click', function () {
    var t = document.getElementById('terminal');
    if (t) t.innerHTML = '';
    log('Terminal cleared.', 'dim');
    buildTermInput();
  });

  /* ─── INTERACTIVE TERMINAL ─── */
  var termInput = null;
  function buildTermInput() {
    var term = document.getElementById('terminal');
    if (!term) return;
    var old = document.getElementById('term-input-line');
    if (old) old.remove();

    var line = document.createElement('div');
    line.className = 'term-line';
    line.id = 'term-input-line';
    line.innerHTML = '<span class="term-prompt">➜</span> ' +
      '<span class="term-path">~/devtoolbox</span> ' +
      '<input type="text" id="term-input" autocomplete="off" spellcheck="false" ' +
      'style="background:transparent;border:none;outline:none;color:var(--edFg);' +
      'font-family:inherit;font-size:12px;width:calc(100% - 200px);caret-color:var(--edFg);padding:0;margin:0" />';
    term.appendChild(line);
    termInput = line.querySelector('#term-input');
    if (!termInput) return;
    termInput.focus();

    termInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var cmd = termInput.value;
        var frozen = document.createElement('div');
        frozen.className = 'term-line';
        frozen.innerHTML = '<span class="term-prompt">➜</span> ' +
          '<span class="term-path">~/devtoolbox</span> ' +
          '<span class="term-cmd">' + escapeHtml(cmd) + '</span>';
        line.replaceWith(frozen);
        runCommand(cmd);
        buildTermInput();
        term.scrollTop = term.scrollHeight;
      }
    });
    term.onclick = function (ev) { if (ev.target !== termInput) termInput.focus(); };
  }

  function runCommand(raw) {
    if (!raw || !raw.trim()) return;
    var trimmed = raw.trim();
    var parts = trimmed.split(/\s+/);
    var cmd = parts[0].toLowerCase();
    var args = trimmed.slice(parts[0].length).trim();

    switch (cmd) {
      case 'help':
        termWrite('<span class="term-warn">Available commands:</span>');
        termWrite('  <span class="term-success">help</span>            Show this help');
        termWrite('  <span class="term-success">ls</span>              List tools');
        termWrite('  <span class="term-success">open</span> &lt;name&gt;     Open a tool (e.g. <span class="term-dim">open json</span>)');
        termWrite('  <span class="term-success">run</span> &lt;js&gt;       Run JS (e.g. <span class="term-dim">run Math.sqrt(16)</span>)');
        termWrite('  <span class="term-success">theme</span>           Toggle dark/light');
        termWrite('  <span class="term-success">date</span>            Show date/time');
        termWrite('  <span class="term-success">whoami</span>          Print user');
        termWrite('  <span class="term-success">echo</span> &lt;text&gt;    Echo back');
        termWrite('  <span class="term-success">clear</span>           Clear terminal');
        termWrite('  <span class="term-success">about</span>           About');
        break;
      case 'ls':
        termWrite('<span class="term-warn">DevToolbox/</span>');
        TOOLS_META.forEach(function (t) {
          termWrite('  <span class="term-success">' + t.file + '</span>  <span class="term-dim">— ' + t.label + '</span>');
        });
        break;
      case 'open':
        var target = args.replace(/\.js$/i, '').trim().toLowerCase();
        var tool = TOOLS_META.filter(function (t) { return t.id === target; })[0];
        if (tool) { openTool(tool.id); termWrite('<span class="term-success">Opened ' + tool.file + '</span>'); }
        else {
          termWrite('<span class="term-error">Tool not found: ' + escapeHtml(args) + '</span>');
          termWrite('<span class="term-dim">Try: ' + TOOLS_META.map(function (t) { return t.id; }).join(', ') + '</span>');
        }
        break;
      case 'run':
        if (!args) { termWrite('<span class="term-error">Usage: run &lt;js&gt;</span>'); break; }
        try {
          var result = (0, eval)(args);
          var display = (result && typeof result === 'object') ? JSON.stringify(result, null, 2) : String(result);
          termWrite('<span class="term-success">' + escapeHtml(display) + '</span>');
        } catch (err) { termWrite('<span class="term-error">' + escapeHtml(err.message) + '</span>'); }
        break;
      case 'theme': if (themeBtn) themeBtn.click(); break;
      case 'date': termWrite('<span class="term-success">' + new Date().toString() + '</span>'); break;
      case 'whoami': termWrite('<span class="term-success">dev</span> <span class="term-dim">(guest@devtoolbox)</span>'); break;
      case 'echo': termWrite('<span class="term-success">' + escapeHtml(args) + '</span>'); break;
      case 'about':
        termWrite('<span class="term-warn">DevToolbox v2.0.0</span>');
        termWrite('<span class="term-dim">Modular developer toolbox — 100% client-side.</span>');
        termWrite('<span class="term-dim">8 tools · No tracking · Works offline (QR needs CDN).</span>');
        break;
      case 'clear':
        var t = document.getElementById('terminal');
        if (t) t.innerHTML = '';
        break;
      default:
        termWrite('<span class="term-error">command not found: ' + escapeHtml(cmd) + '</span>');
        termWrite('<span class="term-dim">Type "help".</span>');
    }
  }

  /* ─── SHORTCUTS ─── */
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'p') {
      e.preventDefault();
      var list = TOOLS_META.map(function (t, i) { return (i + 1) + '. ' + t.label; }).join('\n');
      var n = parseInt(prompt('Command Palette\n\n' + list + '\n\n0. Cancel'), 10);
      if (n >= 1 && n <= TOOLS_META.length) openTool(TOOLS_META[n - 1].id);
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'p') {
      e.preventDefault();
      var list2 = TOOLS_META.map(function (t, i) { return (i + 1) + '. ' + t.file; }).join('\n');
      var n2 = parseInt(prompt('Quick Open\n\n' + list2 + '\n\n0. Cancel'), 10);
      if (n2 >= 1 && n2 <= TOOLS_META.length) openTool(TOOLS_META[n2 - 1].id);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === '`') {
      e.preventDefault();
      if (panel) panel.classList.toggle('hidden');
    }
  });

  /* ─── BOOT ─── */
  function boot() {
    try {
      buildExplorer();
      showWelcome();
      log('DevToolbox Terminal [v2.0.0]', 'success');
      log('Type "help" to see all commands.', 'dim');
      buildTermInput();
      log('', 'dim');

      var jsStatus = document.getElementById('jsStatus');
      if (jsStatus) { jsStatus.textContent = 'JS: ✓ OK'; jsStatus.style.background = '#10b981'; }

      console.log('[DevToolbox] ✓ Booted. Tools:', Object.keys(TOOLS).length);
    } catch (err) {
      showError('Boot error: ' + err.message);
      console.error(err);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
