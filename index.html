<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevToolbox 1.0Beta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<style>
/* ═══════════ THEME ═══════════ */
:root,[data-theme="dark"]{
  --titleBg:#3c3c3c;--titleFg:#ccc;--titleFgDim:#969696;
  --actBg:#333;--actFg:#fff;--actFgDim:rgba(255,255,255,.4);
  --sideBg:#252526;--sideHeaderFg:#bbb;--sideFg:#ccc;--sideFgDim:#969696;
  --edBg:#1e1e1e;--edFg:#d4d4d4;
  --tabActive:#1e1e1e;--tabInactive:#2d2d2d;--tabActiveFg:#fff;--tabInactiveFg:#969696;
  --panelHeaderBg:#252526;--statusBg:#007acc;--statusFg:#fff;
  --inputBg:#3c3c3c;--inputFg:#ccc;--inputBorder:#3c3c3c;
  --btnBg:#0e639c;--btnHover:#1177bb;--btnFg:#fff;
  --focusBorder:#007fd4;--listHover:#2a2d2e;--listActive:#094771;
  --border:#3c3c3c;--borderLight:#2d2d2d;--accent:#007acc;
  --success:#4ec9b0;--warn:#dcdcaa;--danger:#f48771;
  --keyword:#569cd6;--string:#ce9178;--comment:#6a9955;--number:#b5cea8;--variable:#9cdcfe;
}
[data-theme="light"]{
  --titleBg:#ddd;--titleFg:#333;--titleFgDim:#6c6c6c;
  --actBg:#2c2c2c;--actFg:#fff;--actFgDim:rgba(255,255,255,.4);
  --sideBg:#f3f3f3;--sideHeaderFg:#6c6c6c;--sideFg:#333;--sideFgDim:#6c6c6c;
  --edBg:#fff;--edFg:#333;
  --tabActive:#fff;--tabInactive:#ececec;--tabActiveFg:#333;--tabInactiveFg:#6c6c6c;
  --panelHeaderBg:#f3f3f3;--statusBg:#007acc;--statusFg:#fff;
  --inputBg:#fff;--inputFg:#333;--inputBorder:#cecece;
  --btnBg:#007acc;--btnHover:#0062a3;--btnFg:#fff;
  --focusBorder:#0090f1;--listHover:#e8e8e8;--listActive:#0060c0;
  --border:#ddd;--borderLight:#ececec;--accent:#007acc;
  --success:#2e7d32;--warn:#b08800;--danger:#c53636;
  --keyword:#0000ff;--string:#a31515;--comment:#008000;--number:#098658;--variable:#001080;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:13px;color:var(--edFg);background:var(--edBg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.vscode{display:flex;flex-direction:column;height:100vh}
#errorBanner{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#c53636;color:#fff;padding:12px 20px;font-size:13px;font-family:monospace;border-bottom:2px solid #fff}
#errorBanner.show{display:block}

/* TITLE BAR */
.title-bar{height:30px;background:var(--titleBg);color:var(--titleFg);display:flex;align-items:center;justify-content:space-between;padding:0 0 0 8px;font-size:12px;flex-shrink:0;user-select:none}
.title-left{display:flex;align-items:center;gap:12px}
.title-logo{font-weight:600;font-size:12px;padding:0 6px}
.menu-items{display:flex;gap:2px}
.menu-item{padding:3px 8px;border-radius:3px;cursor:pointer;user-select:none;font-size:12px}
.menu-item:hover,.menu-item.open{background:rgba(255,255,255,.15)}
.title-center{flex:1;text-align:center;color:var(--titleFgDim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.title-right{display:flex}
.wc-btn{width:46px;height:30px;color:var(--titleFg);font-size:12px;display:grid;place-items:center}
.wc-btn:hover{background:rgba(255,255,255,.1)}
.wc-btn.close:hover{background:#e81123;color:#fff}

/* DROPDOWN MENU */
.menu-dropdown{position:fixed;background:var(--sideBg);border:1px solid var(--border);border-radius:4px;padding:4px 0;min-width:240px;box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:3000;font-size:12px}
.menu-entry{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;cursor:pointer;color:var(--edFg);white-space:nowrap}
.menu-entry:hover{background:var(--listActive);color:#fff}
.me-shortcut{color:var(--sideFgDim);font-size:11px;margin-left:24px}
.menu-entry:hover .me-shortcut{color:rgba(255,255,255,.7)}
.menu-sep{height:1px;background:var(--border);margin:4px 0}

/* BODY */
.body{flex:1;display:flex;min-height:0}

/* ACTIVITY */
.activity-bar{width:48px;background:var(--actBg);display:flex;flex-direction:column;align-items:center;padding-top:4px;flex-shrink:0}
.activity-icon{width:48px;height:48px;display:grid;place-items:center;color:var(--actFgDim);position:relative;transition:color .1s}
.activity-icon:hover{color:var(--actFg)}
.activity-icon.active{color:var(--actFg)}
.activity-icon.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--actFg)}
.activity-bottom{margin-top:auto;margin-bottom:4px}

/* SIDEBAR */
.side-bar{width:240px;background:var(--sideBg);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--borderLight);overflow:hidden}
.side-bar-header{padding:10px 20px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--sideHeaderFg);text-transform:uppercase;user-select:none}
.side-bar-body{flex:1;overflow-y:auto}
.folder-header{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--sideFg);cursor:pointer;user-select:none}
.folder-header:hover{background:var(--listHover)}
.chevron{font-size:9px;color:var(--sideFgDim)}
.folder-name{flex:1}
.folder-actions{display:flex;gap:2px;opacity:0;transition:opacity .1s}
.folder-header:hover .folder-actions{opacity:1}
.fa-btn{width:18px;height:18px;display:grid;place-items:center;border-radius:2px;color:var(--sideFgDim);font-size:12px;background:transparent;cursor:pointer;border:none}
.fa-btn:hover{background:var(--listHover);color:var(--sideFg)}
.file-tree{padding:2px 0}
.file-item{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 30px;font-size:13px;color:var(--sideFg);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item:hover{background:var(--listHover)}
.file-item.active{background:var(--listActive);color:#fff}
.file-icon{width:16px;height:16px;display:grid;place-items:center;font-size:9px;font-weight:800;border-radius:2px;color:#111;flex-shrink:0;background:#f7df1e}
.file-icon.txt{background:#ccc}

/* WORKBENCH */
.workbench{flex:1;display:flex;flex-direction:column;min-width:0}
.editor-area{flex:1;background:var(--edBg);display:flex;flex-direction:column;min-height:0}
.tabs{height:35px;background:var(--tabInactive);display:flex;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--borderLight)}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;height:100%;font-size:13px;color:var(--tabInactiveFg);background:var(--tabInactive);border-right:1px solid var(--borderLight);cursor:pointer;position:relative;min-width:140px;max-width:220px;flex-shrink:0;user-select:none}
.tab:hover{background:var(--tabActive)}
.tab.active{background:var(--tabActive);color:var(--tabActiveFg)}
.tab.active::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--accent)}
.tab-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-close{width:18px;height:18px;display:grid;place-items:center;border-radius:3px;font-size:11px;color:var(--tabInactiveFg);opacity:0}
.tab:hover .tab-close,.tab.active .tab-close{opacity:1}
.tab-close:hover{background:rgba(255,255,255,.15);color:var(--edFg)}
.breadcrumbs{height:22px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sideFgDim);background:var(--edBg);flex-shrink:0;user-select:none;border-bottom:1px solid var(--borderLight)}
.breadcrumbs .sep{opacity:.5}
.breadcrumbs .crumb{cursor:pointer}
.breadcrumbs .crumb:hover{color:var(--edFg)}
.editor-body{flex:1;display:flex;min-height:0;position:relative}
.editor-content{flex:1;overflow:auto;background:var(--edBg);color:var(--edFg);position:relative}
.editor-content::-webkit-scrollbar{width:10px}
.editor-content::-webkit-scrollbar-thumb{background:rgba(121,121,121,.4)}
.minimap{width:80px;background:var(--edBg);border-left:1px solid var(--borderLight);position:relative;overflow:hidden;flex-shrink:0;opacity:.6}
.minimap-lines{padding:6px;display:flex;flex-direction:column;gap:3px}
.minimap-lines span{height:2px;border-radius:1px;background:var(--sideFgDim);opacity:.5}
.minimap-lines span:nth-child(odd){width:70%;background:var(--keyword)}
.minimap-lines span:nth-child(3n){width:85%;background:var(--string)}
.minimap-lines span:nth-child(5n){width:45%;background:var(--comment)}

/* WELCOME */
.welcome{max-width:720px;margin:0 auto;padding:60px 40px;color:var(--sideFg)}
.welcome h1{font-size:32px;font-weight:300;color:var(--edFg);margin-bottom:8px}
.welcome h1 span{color:var(--accent);font-weight:500}
.welcome-sub{color:var(--sideFgDim);font-size:13px;margin-bottom:32px}
.welcome-section{margin-bottom:28px}
.welcome-section h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sideFgDim);margin-bottom:12px}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.welcome-link{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sideBg);border:1px solid transparent;border-radius:3px;color:var(--edFg);font-size:13px;cursor:pointer;text-align:left;transition:background .1s,border-color .1s}
.welcome-link:hover{background:var(--listHover);border-color:var(--focusBorder)}
.welcome-link .wi{font-size:14px;opacity:.9}
.welcome-hint{font-size:11px;color:var(--sideFgDim);margin-top:8px;padding:8px 12px;background:var(--sideBg);border-left:2px solid var(--accent);border-radius:2px}
kbd{display:inline-block;padding:1px 6px;font-family:'SF Mono',Monaco,monospace;font-size:10px;background:var(--inputBg);color:var(--inputFg);border-radius:3px;border:1px solid var(--border)}

/* PANEL */
.panel{height:200px;background:var(--panelHeaderBg);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.panel.hidden{display:none}
.panel-header{height:35px;background:var(--panelHeaderBg);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-tabs{display:flex;gap:20px;height:100%}
.panel-tab{display:flex;align-items:center;font-size:11px;font-weight:500;letter-spacing:.05em;color:var(--sideFgDim);cursor:pointer;position:relative;padding:0 2px}
.panel-tab:hover{color:var(--edFg)}
.panel-tab.active{color:var(--edFg)}
.panel-tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--accent)}
.panel-actions{display:flex;gap:4px}
.panel-btn{width:24px;height:24px;display:grid;place-items:center;border-radius:3px;color:var(--sideFgDim);font-size:12px}
.panel-btn:hover{background:var(--listHover);color:var(--edFg)}
.panel-body{flex:1;overflow:auto;background:var(--edBg)}
.terminal{padding:8px 12px;font-family:'SF Mono',Monaco,Consolas,'Courier New',monospace;font-size:12px;line-height:1.5;color:var(--edFg);min-height:100%}
.term-line{white-space:pre-wrap;word-break:break-all}
.term-prompt{color:var(--success);font-weight:700}
.term-path{color:var(--variable)}
.term-cmd{color:var(--edFg)}
.term-dim{color:var(--sideFgDim)}
.term-success{color:var(--success)}
.term-warn{color:var(--warn)}
.term-error{color:var(--danger)}

/* STATUS BAR */
.status-bar{height:22px;background:var(--statusBg);color:var(--statusFg);display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:12px;flex-shrink:0;user-select:none}
.status-left,.status-right{display:flex;height:100%}
.status-center{flex:1}
.status-item{display:flex;align-items:center;gap:4px;padding:0 8px;height:100%;font-size:12px;color:inherit;white-space:nowrap}
button.status-item:hover{background:rgba(255,255,255,.12)}
.theme-btn{border-left:1px solid rgba(255,255,255,.15);border-right:1px solid rgba(255,255,255,.15)}

/* TOOL UI */
.tool-view{padding:24px;max-width:900px;margin:0 auto;width:100%}
.tool-view.hidden{display:none}
.tool-header{padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--borderLight)}
.tool-header h2{font-size:15px;font-weight:600;color:var(--edFg);margin-bottom:4px}
.tool-header p{font-size:12px;color:var(--sideFgDim)}
.card{background:var(--sideBg);border:1px solid var(--borderLight);border-radius:3px;padding:20px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--sideFgDim);font-weight:500}
input[type="text"],input[type="number"],textarea,select{width:100%;padding:6px 10px;background:var(--inputBg);color:var(--inputFg);border:1px solid var(--inputBorder);border-radius:2px;font-size:13px;font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--focusBorder)}
textarea{resize:vertical;min-height:100px;font-family:'SF Mono',Monaco,monospace;font-size:12px}
.btn{padding:6px 14px;border-radius:2px;border:1px solid transparent;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;cursor:pointer}
.btn-primary{background:var(--btnBg);color:var(--btnFg)}
.btn-primary:hover{background:var(--btnHover)}
.btn-secondary{background:var(--inputBg);color:var(--edFg);border-color:var(--border)}
.btn-secondary:hover{background:var(--listHover)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.output-row{display:flex;gap:8px}
.output-field{flex:1;font-family:'SF Mono',Monaco,monospace;font-size:14px}
.strength-meter{height:4px;background:var(--border);overflow:hidden;margin:14px 0 6px;border-radius:2px}
.strength-meter > div{height:100%;width:0%;transition:width .3s,background .3s}
.strength-text{font-size:12px;color:var(--sideFgDim)}
.strength-text strong{color:var(--edFg)}
.options-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}
.option{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--inputBg);border:1px solid var(--border);border-radius:2px;cursor:pointer;font-size:12px}
.option input{accent-color:var(--accent)}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.swatch{aspect-ratio:3/4;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;transition:transform .15s;border:1px solid var(--border)}
.swatch:hover{transform:translateY(-2px)}
.swatch span{font-family:'SF Mono',monospace;font-size:10px;font-weight:600;background:rgba(0,0,0,.5);color:#fff;padding:2px 6px;border-radius:2px;align-self:flex-start}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:14px 0}
.stat{padding:12px;background:var(--inputBg);border:1px solid var(--border);border-radius:2px;text-align:center}
.stat-value{font-size:20px;font-weight:700;color:var(--edFg)}
.stat-label{font-size:10px;color:var(--sideFgDim);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.hash-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borderLight)}
.hash-row:last-child{border-bottom:none}
.hash-label{width:80px;font-size:11px;font-weight:700;color:var(--keyword);flex-shrink:0}
.hash-value{flex:1;font-family:'SF Mono',monospace;font-size:11px;word-break:break-all}
.icon-btn{width:28px;height:28px;border-radius:2px;border:1px solid var(--border);background:var(--inputBg);color:var(--edFg);display:grid;place-items:center;flex-shrink:0;font-size:12px;cursor:pointer}
.icon-btn:hover{background:var(--listHover)}
.conv-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.conv-swap{padding:6px 10px;background:var(--inputBg);border:1px solid var(--border);border-radius:2px;color:var(--edFg);cursor:pointer;margin-bottom:4px}
.conv-swap:hover{background:var(--listHover)}

/* CODE EDITOR */
.tool-view-code{position:absolute;inset:0;padding:0!important;max-width:none!important;overflow:hidden;display:flex;flex-direction:column}
.code-editor{display:flex;flex-direction:column;height:100%;width:100%}
.code-toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sideBg);border-bottom:1px solid var(--border);flex-shrink:0}
.code-hint{color:var(--sideFgDim);font-size:11px;margin-left:auto}
.code-split{flex:1;display:flex;flex-direction:column;min-height:0}
.code-pane{display:flex;flex-direction:column;min-height:0;flex:1}
.code-pane+.code-pane{border-top:1px solid var(--border)}
.code-pane-header{padding:4px 12px;background:var(--inputBg);color:var(--sideFgDim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px}
.code-file-icon{background:#f7df1e;color:#111;padding:1px 4px;border-radius:2px;font-size:9px;font-weight:800}
.code-body{flex:1;display:flex;min-height:0;overflow:hidden}
.code-gutter{padding:10px 8px;background:var(--sideBg);color:var(--sideFgDim);text-align:right;font-family:'SF Mono',Monaco,monospace;font-size:12px;line-height:1.5;border-right:1px solid var(--border);user-select:none;overflow:hidden;min-width:40px;margin:0;white-space:pre;flex-shrink:0}
.code-input{flex:1;border:none;background:var(--edBg);color:var(--edFg);padding:10px;font-family:'SF Mono',Monaco,monospace;font-size:12px;line-height:1.5;resize:none;outline:none;white-space:pre;overflow:auto;min-height:0;border-radius:0}
.code-output{flex:1;padding:10px 12px;overflow-y:auto;font-family:'SF Mono',Monaco,monospace;font-size:12px;line-height:1.5;background:var(--edBg)}
.code-out-line{padding:1px 0;white-space:pre-wrap;word-break:break-all}
.code-out-log{color:var(--edFg)}
.code-out-info{color:var(--variable)}
.code-out-warn{color:var(--warn)}
.code-out-error{color:var(--danger)}
.code-out-return{color:var(--success)}
.code-out-empty{color:var(--sideFgDim);font-style:italic}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding-top:80px;z-index:4000}
.modal{background:var(--sideBg);border:1px solid var(--border);border-radius:4px;width:500px;max-width:90vw;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden}
.modal-input{padding:10px 14px;border:none;border-bottom:1px solid var(--border);background:var(--inputBg);color:var(--inputFg);font-size:13px;font-family:inherit;outline:none}
.modal-list{max-height:50vh;overflow-y:auto}
.modal-item{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--edFg);display:flex;align-items:center;gap:10px}
.modal-item:hover,.modal-item.selected{background:var(--listActive);color:#fff}
.modal-empty{padding:20px;text-align:center;color:var(--sideFgDim);font-size:12px}

/* TOAST */
.toast{position:fixed;bottom:40px;right:20px;background:var(--panelHeaderBg);border:1px solid var(--border);color:var(--edFg);padding:10px 16px;border-radius:3px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:all .25s;z-index:1000;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(121,121,121,.4)}
::-webkit-scrollbar-thumb:hover{background:rgba(121,121,121,.7)}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:700px){
  .side-bar{display:none}
  .minimap{display:none}
  .menu-items{display:none}
  .status-right > .status-item:nth-child(n+5){display:none}
}
</style>
</head>
<body>
<div id="errorBanner"></div>

<div class="vscode">
  <div class="title-bar">
    <div class="title-left">
      <div class="title-logo">🧰 DevToolbox</div>
      <div class="menu-items" id="menuItems">
        <div class="menu-item" data-menu="File">File</div>
        <div class="menu-item" data-menu="Edit">Edit</div>
        <div class="menu-item" data-menu="Selection">Selection</div>
        <div class="menu-item" data-menu="View">View</div>
        <div class="menu-item" data-menu="Go">Go</div>
        <div class="menu-item" data-menu="Run">Run</div>
        <div class="menu-item" data-menu="Terminal">Terminal</div>

(function () {
'use strict';

function showError(msg) {
  var b = document.getElementById('errorBanner');
  if (b) { b.textContent = '⚠ ' + msg; b.classList.add('show'); }

}
window.addEventListener('error', function (e) { showError(e.message || 'unknown'); });

/* ─── utils ─── */
var toastEl, toastTimer;
function showToast(msg, type) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.className = 'toast show ' + (type || 'success');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}
function copyText(text) {
  if (!text) return;
  function done() { showToast('Copied!', 'success'); log('Copied ' + text.length + ' characters', 'success'); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(function(){ legacyCopy(text); done(); });
  else { legacyCopy(text); done(); }
}
function legacyCopy(t) {
  var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function log(msg, type) {
  var term = document.getElementById('terminal');
  if (!term) return;
  var colors = { dim:'var(--sideFgDim)', success:'var(--success)', warn:'var(--warn)', error:'var(--danger)', info:'var(--variable)' };
  var line = document.createElement('div');
  line.className = 'term-line';
  line.innerHTML = '<span class="term-prompt">➜</span> <span class="term-path">~/devtoolbox</span> <span style="color:' + (colors[type] || colors.dim) + '">' + escapeHtml(msg) + '</span>';
  term.appendChild(line); term.scrollTop = term.scrollHeight;
}
function termWrite(html) {
  var term = document.getElementById('terminal'); if (!term) return;
  var line = document.createElement('div'); line.className = 'term-line'; line.innerHTML = html;
  term.appendChild(line); term.scrollTop = term.scrollHeight;
}

/* ─── tools ─── */
var TOOLS_META = [
  { id:'password', file:'password.js', label:'Password Generator', icon:'🔐' },
  { id:'qr',       file:'qr.js',       label:'QR Code',            icon:'📱' },
  { id:'color',    file:'color.js',    label:'Color Palette',      icon:'🎨' },
  { id:'text',     file:'text.js',     label:'Text Tools',         icon:'✍️' },
  { id:'json',     file:'json.js',     label:'JSON Formatter',     icon:'{ }' },
  { id:'base64',   file:'base64.js',   label:'Base64',             icon:'🔤' },
  { id:'hash',     file:'hash.js',     label:'Hash Generator',     icon:'#️⃣' },
  { id:'units',    file:'units.js',    label:'Unit Converter',     icon:'📏' }
];
var TOOLS = {};

/* password */
var PW_SETS = { lower:'abcdefghijklmnopqrstuvwxyz', upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ', numbers:'0123456789', symbols:'!@#$%^&*()_+-=[]{}|;:,.<>?' };
function pwRnd(max) { var b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % max; }
function pwGen(len, o) {
  var pool='', req=[];
  if(o.lower){pool+=PW_SETS.lower;req.push(PW_SETS.lower);}
  if(o.upper){pool+=PW_SETS.upper;req.push(PW_SETS.upper);}
  if(o.numbers){pool+=PW_SETS.numbers;req.push(PW_SETS.numbers);}
  if(o.symbols){pool+=PW_SETS.symbols;req.push(PW_SETS.symbols);}
  if(!pool) return '';
  var ch = req.map(function(s){return s[pwRnd(s.length)];});
  while(ch.length<len) ch.push(pool[pwRnd(pool.length)]);
  for(var i=ch.length-1;i>0;i--){var j=pwRnd(i+1),t=ch[i];ch[i]=ch[j];ch[j]=t;}
  return ch.join('');
}
function pwStr(pw, ps) {
  if(!pw||!ps) return {s:0,l:'—',c:'var(--sideFgDim)'};
  var e = pw.length * Math.log2(ps);
  if(e<40) return {s:25,l:'Weak',c:'var(--danger)'};
  if(e<60) return {s:50,l:'Fair',c:'var(--warn)'};
  if(e<80) return {s:75,l:'Strong',c:'var(--success)'};
  return {s:100,l:'Very strong',c:'var(--success)'};
}
TOOLS.password = function(c) {
  c.innerHTML = '<header class="tool-header"><h2>🔐 Password Generator</h2><p>Cryptographically secure passwords.</p></header>' +
    '<div class="card"><div class="output-row"><input type="text" id="pw-out" class="output-field" readonly placeholder="Click Generate" /><button class="btn btn-secondary" id="pw-copy">📋 Copy</button></div>' +
    '<div class="strength-meter"><div id="sf"></div></div><p class="strength-text" id="st">—</p>' +
    '<div class="field" style="margin-top:18px"><label>Length: <strong id="lv">20</strong></label><input type="range" id="len" min="4" max="64" value="20" style="accent-color:var(--accent)" /></div>' +
    '<div class="options-grid"><label class="option"><input type="checkbox" id="ol" checked /> Lowercase</label><label class="option"><input type="checkbox" id="ou" checked /> Uppercase</label><label class="option"><input type="checkbox" id="on" checked /> Numbers</label><label class="option"><input type="checkbox" id="os" checked /> Symbols</label></div>' +
    '<button class="btn btn-primary" id="pw-gen" style="width:100%">⚡ Generate Password</button></div>';
  var $ = function(s){return c.querySelector(s);};
  var out=$('#pw-out'), fill=$('#sf'), st=$('#st'), len=$('#len');
  function o(){return {lower:$('#ol').checked,upper:$('#ou').checked,numbers:$('#on').checked,symbols:$('#os').checked};}
  function ps(){var x=o();return (x.lower?26:0)+(x.upper?26:0)+(x.numbers?10:0)+(x.symbols?PW_SETS.symbols.length:0);}
  function upd(){var r=pwStr(out.value,ps());fill.style.width=r.s+'%';fill.style.background=r.c;st.innerHTML=r.l==='—'?'—':'Strength: <strong style="color:'+r.c+'">'+r.l+'</strong>';}
  function gen(){if(!ps()){showToast('Select at least one set','error');return;}out.value=pwGen(parseInt(len.value,10),o());upd();log('Generated password ('+len.value+' chars)','success');}
  len.addEventListener('input',function(){$('#lv').textContent=len.value;});
  $('#pw-gen').addEventListener('click',gen);
  $('#pw-copy').addEventListener('click',function(){if(!out.value){showToast('Generate first','error');return;}copyText(out.value);});
  gen();
};

/* qr */
TOOLS.qr = function(c) {
  c.innerHTML = '<header class="tool-header"><h2>📱 QR Code Generator</h2><p>Turn any text or URL into a downloadable QR code.</p></header>' +
    '<div class="card"><div id="qs" style="padding:10px;background:var(--inputBg);border-radius:4px;font-size:12px;color:var(--sideFgDim);margin-bottom:14px">⏳ Loading QR library…</div>' +
    '<div class="field"><label>Text or URL</label><input type="text" id="qt" value="https://github.com" /></div>' +
    '<div class="field"><label>Size: <strong id="sv">300</strong>px</label><input type="range" id="qsz" min="150" max="600" step="50" value="300" style="accent-color:var(--accent)" /></div>' +
    '<div class="btn-row"><button class="btn btn-primary" id="qg" disabled>✨ Generate</button><button class="btn btn-secondary" id="qd">⬇️ Download</button></div>' +
    '<div style="display:flex;justify-content:center;padding:16px;margin-top:12px"><canvas id="qc" style="background:#fff;padding:12px;border-radius:2px" width="300" height="300"></canvas></div></div>';
  var $ = function(s){return c.querySelector(s);};
  var txt=$('#qt'), sz=$('#qsz'), cv=$('#qc'), sEl=$('#qs'), gb=$('#qg'), ready=false;
  var urls = ['https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js','https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js','https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'];
  var i = 0;
  (function next(){
    if (window.QRCode && window.QRCode.toCanvas) return onReady();
    if (i >= urls.length) return onFail();
    var s = document.createElement('script'); s.src = urls[i++]; s.async = true;
    var to = setTimeout(function(){s.remove();next();}, 5000);
    s.onload = function(){ clearTimeout(to); (window.QRCode && window.QRCode.toCanvas) ? onReady() : next(); };
    s.onerror = function(){ clearTimeout(to); s.remove(); next(); };
    document.head.appendChild(s);
  })();
  function onReady(){ ready=true; sEl.textContent='✓ QR library ready'; sEl.style.color='var(--success)'; gb.disabled=false; log('QR library loaded','success'); gen(); }
  function onFail(){ sEl.innerHTML='✗ Could not load QR library — CDN blocked.<br><span style="font-size:11px;opacity:.7">Other tools still work.</span>'; sEl.style.color='var(--danger)'; log('QR CDN blocked','error'); }
  function gen(){ if(!ready||!txt.value.trim()) return; try{ window.QRCode.toCanvas(cv,txt.value,{width:parseInt(sz.value,10),margin:2,color:{dark:'#000',light:'#fff'}},function(e){if(e)log('QR error: '+e.message,'error');}); }catch(e){log('QR error: '+e.message,'error');} }
  sz.addEventListener('input',function(){$('#sv').textContent=sz.value;if(ready)gen();});
  gb.addEventListener('click',function(){gen();log('QR generated','success');});
  $('#qd').addEventListener('click',function(){try{var a=document.createElement('a');a.download='qrcode.png';a.href=cv.toDataURL('image/png');a.click();log('QR downloaded','success');}catch(e){}});
  txt.addEventListener('input',function(){if(ready)gen();});
};

/* color */
function hsl2hex(h,s,l){ l/=100; var a=(s*Math.min(l,1-l))/100; function f(n){var k=(n+h/30)%12;var col=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*col).toString(16).padStart(2,'0');} return '#'+f(0)+f(8)+f(4); }
TOOLS.color = function(c) {
  c.innerHTML = '<header class="tool-header"><h2>🎨 Color Palette Generator</h2><p>Click any swatch to copy its HEX.</p></header>' +
    '<div class="card"><div class="btn-row" style="margin-top:0"><button class="btn btn-primary" id="pg">🎲 New Palette</button><span style="align-self:center;color:var(--sideFgDim);font-size:12px">Press Space</span></div><div class="palette" id="pal"></div></div>';
  var el = c.querySelector('#pal');
  function draw(){ el.innerHTML=''; var base=Math.floor(Math.random()*360); for(var i=0;i<5;i++){ var h=(base+i*40+Math.random()*20)%360, s=55+Math.floor(Math.random()*30), l=40+Math.floor(Math.random()*30); (function(col){ var sw=document.createElement('div'); sw.className='swatch'; sw.style.background=col; var lb=document.createElement('span'); lb.textContent=col.toUpperCase(); sw.appendChild(lb); sw.addEventListener('click',function(){copyText(col);}); el.appendChild(sw); })(hsl2hex(h,s,l)); } }
  c.querySelector('#pg').addEventListener('click',function(){draw();log('New palette generated','success');});
  document.addEventListener('keydown',function(e){if(e.code==='Space'&&['INPUT','TEXTAREA'].indexOf(e.target.tagName)===-1){e.preventDefault();draw();}});
  draw();
};

/* text */
TOOLS.text = function(c) {
  c.innerHTML = '<header class="tool-header"><h2>✍️ Text Tools</h2><p>Convert case, count words — offline.</p></header>' +
    '<div class="card"><div class="field"><label>Your text</label><textarea id="tx" placeholder="Type or paste text here…"></textarea></div>' +
    '<div class="stats-grid"><div class="stat"><div class="stat-value" id="sc">0</div><div class="stat-label">Chars</div></div><div class="stat"><div class="stat-value" id="sw">0</div><div class="stat-label">Words</div></div><div class="stat"><div class="stat-value" id="sl">0</div><div class="stat-label">Lines</div></div><div class="stat"><div class="stat-value" id="ss">0</div><div class="stat-label">Sentences</div></div></div>' +
    '<div class="btn-row"><button class="btn btn-secondary" data-fn="upper">UPPER</button><button class="btn btn-secondary" data-fn="lower">lower</button><button class="btn btn-secondary" data-fn="title">Title</button><button class="btn btn-secondary" data-fn="sentence">Sentence</button><button class="btn btn-secondary" data-fn="camel">camelCase</button><button class="btn btn-secondary" data-fn="snake">snake_case</button><button class="btn btn-secondary" data-fn="kebab">kebab-case</button><button class="btn btn-secondary" data-fn="alternating">aLtErN</button><button class="btn btn-secondary" data-fn="copy">📋 Copy</button></div></div>';
  var inp = c.querySelector('#tx');
  var fns = { upper:function(t){return t.toUpperCase();}, lower:function(t){return t.toLowerCase();}, title:function(s){return s.replace(/\w\S*/g,function(w){return w[0].toUpperCase()+w.slice(1).toLowerCase();});}, sentence:function(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}, camel:function(s){return s.replace(/[^a-zA-Z0-9]+(.)/g,function(_,x){return x.toUpperCase();}).replace(/^./,function(x){return x.toLowerCase();});}, snake:function(s){return s.replace(/([a-z])([A-Z])/g,'$1_$2').replace(/[\s-]+/g,'_').toLowerCase();}, kebab:function(s){return s.replace(/([a-z])([A-Z])/g,'$1-$2').replace(/[\s_]+/g,'-').toLowerCase();}, alternating:function(s){return s.split('').map(function(ch,i){return i%2?ch.toUpperCase():ch.toLowerCase();}).join('');} };
  function stats(){ var t=inp.value; c.querySelector('#sc').textContent=t.length; c.querySelector('#sw').textContent=t.trim()?t.trim().split(/\s+/).length:0; c.querySelector('#sl').textContent=t?t.split('\n').length:0; c.querySelector('#ss').textContent=(t.match(/[.!?]+/g)||[]).length; }
  inp.addEventListener('input',stats);
  c.querySelectorAll('[data-fn]').forEach(function(b){ b.addEventListener('click',function(){ var fn=b.dataset.fn; if(fn==='copy') return copyText(inp.value); inp.value=fns[fn](inp.value); stats(); }); });
  stats();
};

/* json */
TOOLS.json = function(c) {
  c.innerHTML = '<header class="tool-header"><h2>{ } JSON Formatter</h2><p>Format, minify and validate JSON.</p></header>' +
    '<div class="card"><div class="field"><label>Input JSON</label><textarea id="ji" placeholder=\'{"hello":"world"}\'></textarea></div>' +
    '<div class="btn-row"><button class="btn btn-primary" data-act="format">✨ Format</button><button class="btn btn-secondary" data-act="minify">📦 Minify</button><button class="btn btn-secondary" data-act="clear">🗑️ Clear</button></div>' +
    '<div id="jst" style="margin-top:14px;font-size:12px;color:var(--sideFgDim)"></div></div>';
  var inp = c.querySelector('#ji'), st = c.querySelector('#jst');
  function setSt(m, col){ st.innerHTML=m; st.style.color=col||'var(--sideFgDim)'; }
  function proc(a){ var raw=inp.value.trim(); if(!raw) return setSt('Input is empty','var(--warn)'); try{ var p=JSON.parse(raw); if(a==='format'){inp.value=JSON.stringify(p,null,2);setSt('✓ Valid JSON — formatted','var(--success)');log('JSON formatted','success');}else{inp.value=JSON.stringify(p);setSt('✓ Valid JSON — minified','var(--success)');log('JSON minified','success');} }catch(e){setSt('✗ Invalid JSON: '+e.message,'var(--danger)');log('JSON error: '+e.message,'error');} }
  c.querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click',function(){ var a=b.dataset.act; if(a==='clear'){inp.value='';setSt('');}else proc(a); }); });
};

/* base64 */
TOOLS.base64 = function(c) {
  c.innerHTML = '<header class="tool-header"><h2>🔤 Base64</h2><p>Encode / decode Base64 (UTF-8 safe).</p></header>' +
    '<div class="card"><div class="field"><label>Input</label><textarea id="bi" placeholder="Enter text or Base64…"></textarea></div>' +
    '<div class="btn-row"><button class="btn btn-primary" id="be">Encode →</button><button class="btn btn-secondary" id="bd">← Decode</button><button class="btn btn-secondary" id="bc">📋 Copy</button><button class="btn btn-secondary" id="bclr">🗑️ Clear</button></div>' +
    '<div class="field" style="margin-top:14px"><label>Result</label><textarea id="bo" readonly></textarea></div>' +
    '<p id="berr" style="color:var(--danger);font-size:12px;margin-top:6px"></p></div>';
  var inp=c.querySelector('#bi'), out=c.querySelector('#bo'), err=c.querySelector('#berr');
  function enc(s){ var b=new TextEncoder().encode(s), bin=''; b.forEach(function(x){bin+=String.fromCharCode(x);}); return btoa(bin); }
  function dec(s){ var bin=atob(s.trim()), b=Uint8Array.from(bin,function(ch){return ch.charCodeAt(0);}); return new TextDecoder().decode(b); }
  c.querySelector('#be').addEventListener('click',function(){err.textContent='';try{out.value=enc(inp.value);log('Base64 encoded','success');}catch(e){err.textContent=e.message;}});
  c.querySelector('#bd').addEventListener('click',function(){err.textContent='';try{out.value=dec(inp.value);log('Base64 decoded','success');}catch(e){err.textContent='Invalid Base64 input';log('Base64 decode failed','error');}});
  c.querySelector('#bc').addEventListener('click',function(){if(out.value)copyText(out.value);});

};

/* hash */
TOOLS.hash = function(c) {

    '<div class="card"><div class="field"><label>Input text</label><textarea id="hi" placeholder="Enter text to hash…"></textarea></div><div id="hr" style="margin-top:14px"></div></div>';
  var inp=c.querySelector('#hi'), res=c.querySelector('#hr'), ALGOS=['SHA-1','SHA-256','SHA-384','SHA-512'];
  function dg(a,t){ return crypto.subtle.digest(a,new TextEncoder().encode(t)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }); }
  function upd(){ res.innerHTML=''; var t=inp.value; if(!t) return; ALGOS.forEach(function(a){ dg(a,t).then(function(h){ var r=document.createElement('div'); r.className='hash-row'; r.innerHTML='<div class="hash-label">'+a+'</div><div class="hash-value">'+h+'</div><button class="icon-btn" title="Copy">📋</button>'; r.querySelector('button').addEventListener('click',function(){copyText(h);}); res.appendChild(r); }).catch(function(e){log('Hash error: '+e.message,'error');}); }); }
  var timer; inp.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(function(){upd();log('Hashes calculated','dim');},250);});

/* units */
TOOLS.units = function(c) {
  var CFG = {
    Length:{units:{mm:['Millimeter',0.001],cm:['Centimeter',0.01],m:['Meter',1],km:['Kilometer',1000],in:['Inch',0.0254],ft:['Foot',0.3048],yd:['Yard',0.9144],mi:['Mile',1609.344]}},
    Mass:{units:{mg:['Milligram',0.001],g:['Gram',1],kg:['Kilogram',1000],oz:['Ounce',28.3495],lb:['Pound',453.592]}},
    Temperature:{special:true,units:{C:['Celsius'],F:['Fahrenheit'],K:['Kelvin']}},
    Data:{units:{bit:['Bit',0.125],B:['Byte',1],KB:['Kilobyte',1024],MB:['Megabyte',1048576],GB:['Gigabyte',1073741824],TB:['Terabyte',1099511627776]}}
  };
  c.innerHTML = '<header class="tool-header"><h2>📏 Unit Converter</h2><p>Length, mass, temperature, data.</p></header>' +
    '<div class="card"><div class="field"><label>Category</label><select id="ucat"></select></div>' +
    '<div class="field"><label>From</label><input type="number" id="uval" value="1" /><select id="uf"></select></div>' +
    '<div class="conv-row"><div></div><button class="conv-swap" id="usw">⇅</button><div></div></div>' +
    '<div class="field"><label>To</label><input type="text" id="ures" readonly /><select id="ut"></select></div></div>';
  var $ = function(s){return c.querySelector(s);};
  var cat=$('#ucat'), from=$('#uf'), to=$('#ut'), val=$('#uval'), res=$('#ures');
  cat.innerHTML = Object.keys(CFG).map(function(k){return '<option>'+k+'</option>';}).join('');
  function convert(v,f,t,catK){ var cfg=CFG[catK]; if(cfg.special){ var cv; if(f==='C')cv=v; else if(f==='F')cv=(v-32)*5/9; else cv=v-273.15; if(t==='C')return cv; if(t==='F')return cv*9/5+32; return cv+273.15; } return (v*cfg.units[f][1])/cfg.units[t][1]; }
  function fmt(n){ if(!isFinite(n)) return '—'; if(Math.abs(n)>=1e9||(Math.abs(n)<1e-4&&n!==0)) return n.toExponential(4); return parseFloat(n.toFixed(6)).toString(); }
  function pop(){ var u=CFG[cat.value].units; var o=Object.keys(u).map(function(k){return '<option value="'+k+'">'+u[k][0]+' ('+k+')</option>';}).join(''); from.innerHTML=o; to.innerHTML=o; var ks=Object.keys(u); from.value=ks[0]; to.value=ks[1]||ks[0]; upd(); }
  function upd(){ var v=parseFloat(val.value); res.value=isNaN(v)?'':fmt(convert(v,from.value,to.value,cat.value)); }
  cat.addEventListener('change',pop); from.addEventListener('change',upd); to.addEventListener('change',upd); val.addEventListener('input',upd);
  $('#usw').addEventListener('click',function(){var t=from.value;from.value=to.value;to.value=t;upd();});

   APP

var openTabs = {}, activeId = null, untitledCount = 0;
var $ = function(s){ return document.querySelector(s); };
var fileTree=$('#fileTree'), tabsEl=$('#tabs'), editorContent=$('#editorContent'),
    breadcrumbs=$('#breadcrumbs'), titleCenter=$('#titleCenter'),
    statusLang=$('#statusLang'), panel=$('#panel'), themeBtn=$('#themeBtn');

/* ─── explorer ─── */
function buildExplorer(){
  fileTree.innerHTML='';
  TOOLS_META.forEach(function(t){
    var item=document.createElement('div'); item.className='file-item'; item.dataset.id=t.id;
    item.innerHTML='<span class="file-icon">JS</span><span>'+t.file+'</span>';
    item.addEventListener('click',function(){openTool(t.id);});
    fileTree.appendChild(item);
  });
  Object.keys(openTabs).forEach(function(id){
    var e = openTabs[id];
    if (e.meta.isCode) {
      var item=document.createElement('div'); item.className='file-item'; item.dataset.id=id;
      item.innerHTML='<span class="file-icon">JS</span><span>'+e.meta.file+'</span>';
      item.addEventListener('click',function(){activateTab(id);});
      fileTree.appendChild(item);
    }
  });
}

/* ─── open tool ─── */
function openTool(id){
  var meta = TOOLS_META.filter(function(t){return t.id===id;})[0];
  if(!meta) return;
  if(openTabs[id]) return activateTab(id);
  if(typeof TOOLS[id]!=='function'){ log('Tool "'+id+'" not available','error'); return; }
  var tabEl = document.createElement('div'); tabEl.className='tab'; tabEl.dataset.id=id;
  tabEl.innerHTML='<span class="file-icon">JS</span><span class="tab-label">'+meta.file+'</span><button class="tab-close" title="Close">✕</button>';
  tabEl.addEventListener('click',function(e){ if(e.target.classList.contains('tab-close')) closeTab(id); else activateTab(id); });
  tabsEl.appendChild(tabEl);
  var viewEl = document.createElement('div'); viewEl.className='tool-view hidden'; editorContent.appendChild(viewEl);
  openTabs[id] = { tabEl:tabEl, viewEl:viewEl, meta:meta };
  try { TOOLS[id](viewEl); } catch(err){ viewEl.innerHTML='<div class="card" style="color:var(--danger)">Error: '+(err.message||err)+'</div>'; log('Error: '+err.message,'error'); }
  log('Opened '+meta.file,'success');
  activateTab(id);
}

/* ─── new code file ─── */
function createNewFile(content, name){
  untitledCount++;
  var id = 'untitled-'+untitledCount;
  var filename = name || ('untitled-'+untitledCount+'.js');
  if (content === undefined || content === null) {
    content =
      '// 🧰 DevToolbox 1.0Beta — code editor\n' +
      '// Press Ctrl+Enter or click ▶ Run to execute.\n\n' +
      'console.log("Hello from DevToolbox!");\n\n' +
      'const nums = [1, 2, 3, 4, 5];\n' +
      'const sum = nums.reduce((a, b) => a + b, 0);\n' +
      'console.log("Sum:", sum);\n';
  }
  var tabEl = document.createElement('div'); tabEl.className='tab'; tabEl.dataset.id=id;
  tabEl.innerHTML='<span class="file-icon">JS</span><span class="tab-label">'+filename+'</span><button class="tab-close" title="Close">✕</button>';
  tabEl.addEventListener('click',function(e){ if(e.target.classList.contains('tab-close')) closeTab(id); else activateTab(id); });
  tabsEl.appendChild(tabEl);
  var viewEl = document.createElement('div'); viewEl.className='tool-view tool-view-code hidden'; editorContent.appendChild(viewEl);
  openTabs[id] = { tabEl:tabEl, viewEl:viewEl, meta:{ file:filename, label:'Code', isCode:true } };
  renderCodeEditor(viewEl, content, filename);
  log('Created '+filename,'success');
  activateTab(id);
  buildExplorer();
}

function renderCodeEditor(viewEl, initialCode, filename){
  viewEl.innerHTML =
    '<div class="code-editor">' +
      '<div class="code-toolbar">' +
        '<button class="btn btn-primary" id="code-run">▶ Run</button>' +
        '<button class="btn btn-secondary" id="code-save">💾 Save as .js</button>' +
        '<span class="code-hint">Ctrl+Enter to run · Tab = 2 spaces</span>' +
      '</div>' +
      '<div class="code-split">' +
        '<div class="code-pane">' +
          '<div class="code-pane-header"><span class="code-file-icon">JS</span> ' + filename + '</div>' +
          '<div class="code-body">' +
            '<pre class="code-gutter" id="code-gutter">1</pre>' +
            '<textarea class="code-input" id="code-input" spellcheck="false"></textarea>' +
          '</div>' +
        '</div>' +
        '<div class="code-pane">' +
          '<div class="code-pane-header">OUTPUT</div>' +
          '<div class="code-output" id="code-output"><div class="code-out-line code-out-empty">Press ▶ Run or Ctrl+Enter to execute</div></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  var textarea = viewEl.querySelector('#code-input');
  var gutter = viewEl.querySelector('#code-gutter');
  var output = viewEl.querySelector('#code-output');
  var runBtn = viewEl.querySelector('#code-run');
  var saveBtn = viewEl.querySelector('#code-save');

  textarea.value = initialCode;

  function updateGutter(){
    var lines = textarea.value.split('\n').length;
    var g = '';
    for(var i=1;i<=lines;i++) g += i + '\n';
    gutter.textContent = g;
  }
  function updateCursor(){
    var pos = textarea.selectionStart;
    var before = textarea.value.substring(0, pos);
    var lines = before.split('\n');
    var ln = lines.length, col = lines[lines.length-1].length + 1;
    var sc = document.getElementById('statusCursor');
    if(sc) sc.textContent = 'Ln ' + ln + ', Col ' + col;
  }

  updateGutter();
  textarea.addEventListener('input', function(){ updateGutter(); updateCursor(); });
  textarea.addEventListener('click', updateCursor);
  textarea.addEventListener('keyup', updateCursor);
  textarea.addEventListener('scroll', function(){ gutter.scrollTop = textarea.scrollTop; });

  textarea.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){
      e.preventDefault();
      var s = textarea.selectionStart, en = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, s) + '  ' + textarea.value.substring(en);
      textarea.selectionStart = textarea.selectionEnd = s + 2;
      updateGutter();
    }
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      doRun();
    }
  });

  function doRun(){
    var code = textarea.value;
    var out = '';
    var origLog = console.log, origErr = console.error, origWarn = console.warn, origInfo = console.info;

    function capture(type, args){
      var line = Array.prototype.slice.call(args).map(function(a){
        if(a === null) return 'null';
        if(a === undefined) return 'undefined';
        if(typeof a === 'object'){
          try { return JSON.stringify(a, null, 2); } catch(e){ return String(a); }
        }
        return String(a);
      }).join(' ');
      out += '<div class="code-out-line code-out-' + type + '">' + escapeHtml(line) + '</div>';
    }

    console.log = function(){ capture('log', arguments); };
    console.error = function(){ capture('error', arguments); };
    console.warn = function(){ capture('warn', arguments); };
    console.info = function(){ capture('info', arguments); };

    var t0 = performance.now();
    try {
      var result = (0, eval)(code);
      if(result !== undefined){
        var disp;
        if (typeof result === 'object') {
          try { disp = JSON.stringify(result, null, 2); } catch(e){ disp = String(result); }
        } else disp = String(result);
        out += '<div class="code-out-line code-out-return">→ ' + escapeHtml(disp) + '</div>';
      }
    } catch(err){
      out += '<div class="code-out-line code-out-error">✗ ' + escapeHtml(err.message) + '</div>';
    } finally {
      console.log = origLog; console.error = origErr; console.warn = origWarn; console.info = origInfo;
    }
    var t1 = performance.now();
    out += '<div class="code-out-line code-out-info">— Executed in ' + (t1-t0).toFixed(1) + ' ms —</div>';

    output.innerHTML = out;
    log('Executed ' + filename, 'success');
  }

  runBtn.addEventListener('click', doRun);

  saveBtn.addEventListener('click', function(){
    var blob = new Blob([textarea.value], { type: 'text/javascript' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    log('Downloaded ' + filename, 'success');
    showToast('Saved ' + filename, 'success');
  });

  setTimeout(function(){ textarea.focus(); updateCursor(); }, 100);
}

/* ─── activate / close ─── */
function activateTab(id){
  var e = openTabs[id]; if(!e) return;
  var w = document.querySelector('.welcome'); if(w) w.remove();
  Object.keys(openTabs).forEach(function(k){ openTabs[k].tabEl.classList.remove('active'); openTabs[k].viewEl.classList.add('hidden'); });
  e.tabEl.classList.add('active');
  e.viewEl.classList.remove('hidden');
  document.querySelectorAll('.file-item').forEach(function(el){ el.classList.toggle('active', el.dataset.id === id); });
  breadcrumbs.innerHTML = '<span class="crumb">DevToolbox</span><span class="sep">›</span><span class="crumb">' + e.meta.file + '</span><span class="sep">›</span><span class="crumb">' + (e.meta.isCode ? 'Editor' : 'Preview') + '</span>';
  titleCenter.textContent = e.meta.file + ' — DevToolbox 1.0Beta';
  document.title = e.meta.file + ' — DevToolbox 1.0Beta';
  statusLang.textContent = 'JavaScript';
  activeId = id;
}

function closeTab(id){
  var e = openTabs[id]; if(!e) return;
  var wasActive = e.tabEl.classList.contains('active');
  e.tabEl.remove(); e.viewEl.remove(); delete openTabs[id];
  log('Closed ' + e.meta.file, 'dim');
  if(Object.keys(openTabs).length === 0){ showWelcome(); breadcrumbs.innerHTML=''; titleCenter.textContent='Welcome — DevToolbox 1.0Beta'; document.title='DevToolbox 1.0Beta'; activeId=null; }
  else if(wasActive){ var ks = Object.keys(openTabs); activateTab(ks[ks.length-1]); }
  buildExplorer();
}

/* ─── interactive terminal ─── */
var termInput = null;
function buildTermInput(){
  var term = document.getElementById('terminal'); if(!term) return;
  var old = document.getElementById('term-input-line'); if(old) old.remove();
  var line = document.createElement('div'); line.className='term-line'; line.id='term-input-line';
  line.innerHTML = '<span class="term-prompt">➜</span> <span class="term-path">~/devtoolbox</span> <input type="text" id="term-input" autocomplete="off" spellcheck="false" style="background:transparent;border:none;outline:none;color:var(--edFg);font-family:inherit;font-size:12px;width:calc(100% - 200px);caret-color:var(--edFg);padding:0;margin:0" />';
  term.appendChild(line);
  termInput = line.querySelector('#term-input');
  if(!termInput) return;
  termInput.focus();
  termInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var cmd = termInput.value;
      var frozen = document.createElement('div'); frozen.className='term-line';
      frozen.innerHTML = '<span class="term-prompt">➜</span> <span class="term-path">~/devtoolbox</span> <span class="term-cmd">' + escapeHtml(cmd) + '</span>';
      line.replaceWith(frozen);
      runCommand(cmd);
      buildTermInput();
      term.scrollTop = term.scrollHeight;
    }
  });
  term.onclick = function(ev){ if(ev.target !== termInput) termInput.focus(); };
}

function runCommand(raw){
  if(!raw || !raw.trim()) return;
  var trimmed = raw.trim(), parts = trimmed.split(/\s+/), cmd = parts[0].toLowerCase(), args = trimmed.slice(parts[0].length).trim();
  switch(cmd){
    case 'help':
      termWrite('<span class="term-warn">Commands:</span>');
      termWrite('  <span class="term-success">help</span>            This help');
      termWrite('  <span class="term-success">ls</span>              List tools');
      termWrite('  <span class="term-success">new</span>             New JS file');
      termWrite('  <span class="term-success">run</span>             Run active code file');
      termWrite('  <span class="term-success">open</span> &lt;name&gt;     Open tool');
      termWrite('  <span class="term-success">eval</span> &lt;js&gt;       Run JS expression');
      termWrite('  <span class="term-success">theme</span>           Toggle theme');
      termWrite('  <span class="term-success">date</span> / <span class="term-success">whoami</span> / <span class="term-success">echo</span>');
      termWrite('  <span class="term-success">clear</span> / <span class="term-success">about</span>');
      break;
    case 'ls':
      termWrite('<span class="term-warn">DevToolbox/</span>');
      TOOLS_META.forEach(function(t){ termWrite('  <span class="term-success">'+t.file+'</span>  <span class="term-dim">— '+t.label+'</span>'); });
      Object.keys(openTabs).forEach(function(id){ var e=openTabs[id]; if(e.meta.isCode) termWrite('  <span class="term-success">'+e.meta.file+'</span>  <span class="term-dim">— (untitled)</span>'); });
      break;
    case 'new': createNewFile(); termWrite('<span class="term-success">Created new file</span>'); break;
    case 'run': runActiveFile(); break;
    case 'open':
      var target = args.replace(/\.js$/i, '').trim().toLowerCase();
      var t = TOOLS_META.filter(function(x){return x.id===target;})[0];
      if(t){ openTool(t.id); termWrite('<span class="term-success">Opened '+t.file+'</span>'); }
      else { termWrite('<span class="term-error">Not found: '+escapeHtml(args)+'</span>'); }
      break;
    case 'eval':
      if(!args){ termWrite('<span class="term-error">Usage: eval &lt;js&gt;</span>'); break; }
      try { var r = (0, eval)(args); termWrite('<span class="term-success">'+escapeHtml(typeof r === 'object' ? JSON.stringify(r) : String(r))+'</span>'); }
      catch(e){ termWrite('<span class="term-error">'+escapeHtml(e.message)+'</span>'); }
      break;
    case 'theme': if(themeBtn) themeBtn.click(); break;
    case 'date': termWrite('<span class="term-success">'+new Date().toString()+'</span>'); break;
    case 'whoami': termWrite('<span class="term-success">dev</span> <span class="term-dim">(guest@devtoolbox)</span>'); break;
    case 'echo': termWrite('<span class="term-success">'+escapeHtml(args)+'</span>'); break;
    case 'about':
      termWrite('<span class="term-warn">DevToolbox 1.0Beta</span>');
      termWrite('<span class="term-dim">Modular developer toolbox — 100% client-side.</span>');
      break;
    case 'clear': var t2=document.getElementById('terminal'); if(t2) t2.innerHTML=''; break;
    default:
      termWrite('<span class="term-error">command not found: '+escapeHtml(cmd)+'</span>');
      termWrite('<span class="term-dim">Type "help".</span>');
  }
}

/* ─── file actions ─── */
function saveActiveFile(){
  if(!activeId) return showToast('No active file','error');
  var e = openTabs[activeId]; if(!e) return;
  var content = '', filename = e.meta.file;
  if(e.meta.isCode){ var ta = e.viewEl.querySelector('.code-input'); content = ta ? ta.value : ''; }
  else { content = '// Tool: ' + filename + '\n// Not a real file'; }
  var blob = new Blob([content], { type: 'text/javascript' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  log('Saved ' + filename, 'success');
  showToast('Saved ' + filename, 'success');
}
function runActiveFile(){

/* ─── modal palette ─── */
function showPalette(title, items){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal"><input class="modal-input" placeholder="'+title+'" autofocus /><div class="modal-list" id="ml"></div></div>';
  var input = overlay.querySelector('.modal-input');
  var list = overlay.querySelector('#ml');
  var selectedIdx = 0, filtered = items.slice();
  function render(){
    list.innerHTML = '';
    if(filtered.length === 0){ list.innerHTML = '<div class="modal-empty">No results</div>'; return; }
    filtered.forEach(function(item, i){
      var el = document.createElement('div');
      el.className = 'modal-item' + (i === selectedIdx ? ' selected' : '');
      el.textContent = item.label;
      el.addEventListener('click', function(){ close(); item.action(); });
      el.addEventListener('mouseenter', function(){ selectedIdx = i; render(); });
      list.appendChild(el);
    });
  }
  function filter(){
    var q = input.value.toLowerCase();
    filtered = items.filter(function(it){ return it.label.toLowerCase().indexOf(q) !== -1; });
    selectedIdx = 0; render();
  }
  input.addEventListener('input', filter);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowDown'){ e.preventDefault(); if(selectedIdx < filtered.length-1){ selectedIdx++; render(); } }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); if(selectedIdx > 0){ selectedIdx--; render(); } }
    else if(e.key === 'Enter'){ e.preventDefault(); if(filtered[selectedIdx]){ var a = filtered[selectedIdx].action; close(); a(); } }
  });
  overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });
  function close(){ overlay.remove(); }
  document.body.appendChild(overlay);
  setTimeout(function(){ input.focus(); }, 50);
  render();
}
function showCommandPalette(){
  var items = [];
  items.push({ label: 'File: New File', action: function(){ createNewFile(); } });
  items.push({ label: 'File: Save Active File', action: saveActiveFile });
  items.push({ label: 'File: Close All', action: function(){ Object.keys(openTabs).forEach(closeTab); } });
  items.push({ label: 'Run: Run Active File', action: runActiveFile });
  items.push({ label: 'View: Toggle Terminal', action: function(){ panel.classList.toggle('hidden'); } });
  items.push({ label: 'View: Toggle Theme', action: function(){ if(themeBtn) themeBtn.click(); } });
  TOOLS_META.forEach(function(t){ items.push({ label: 'Open: ' + t.label, action: function(){ openTool(t.id); } }); });
  items.push({ label: 'Help: About', action: function(){ runCommand('about'); } });
  showPalette('Type a command...', items);
}
function showQuickOpen(){
  var items = [];
  Object.keys(openTabs).forEach(function(id){ var e = openTabs[id]; items.push({ label: e.meta.file, action: function(){ activateTab(id); } }); });
  if(items.length === 0) items.push({ label: 'No open files. Create one with Ctrl+N', action: function(){ createNewFile(); } });
  showPalette('Quick open...', items);
}

/* ─── menu system ─── */
var MENUS = {
  File: [
    { label: 'New File', shortcut: 'Ctrl+N', action: function(){ createNewFile(); } },
    { sep: true },
    { label: 'Save', shortcut: 'Ctrl+S', action: saveActiveFile },
    { label: 'Save As...', action: saveActiveFile },
    { sep: true },
    { label: 'Close Editor', shortcut: 'Ctrl+W', action: function(){ if(activeId) closeTab(activeId); } },
    { label: 'Close All', action: function(){ Object.keys(openTabs).forEach(closeTab); } }
  ],
  Edit: [
    { label: 'Undo', shortcut: 'Ctrl+Z', action: function(){ document.execCommand('undo'); } },
    { label: 'Redo', shortcut: 'Ctrl+Y', action: function(){ document.execCommand('redo'); } },
    { sep: true },
    { label: 'Cut', shortcut: 'Ctrl+X', action: function(){ try { document.execCommand('cut'); } catch(e){} } },
    { label: 'Copy', shortcut: 'Ctrl+C', action: function(){ try { document.execCommand('copy'); } catch(e){} } },
    { label: 'Paste', shortcut: 'Ctrl+V', action: function(){ showToast('Use Ctrl+V to paste','error'); } },
    { sep: true },
    { label: 'Select All', shortcut: 'Ctrl+A', action: function(){ var ae = document.activeElement; if(ae && (ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')) ae.select(); else document.execCommand('selectAll'); } }
  ],
  Selection: [
    { label: 'Select All', shortcut: 'Ctrl+A', action: function(){ var ae = document.activeElement; if(ae && (ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')) ae.select(); else document.execCommand('selectAll'); } }
  ],
  View: [
    { label: 'Command Palette', shortcut: 'Ctrl+Shift+P', action: showCommandPalette },
    { label: 'Quick Open', shortcut: 'Ctrl+P', action: showQuickOpen },
    { sep: true },
    { label: 'Toggle Terminal', shortcut: 'Ctrl+`', action: function(){ panel.classList.toggle('hidden'); } },
    { label: 'Toggle Theme', action: function(){ if(themeBtn) themeBtn.click(); } }
  ],
  Go: [
    { label: 'Go to File...', shortcut: 'Ctrl+P', action: showQuickOpen },
    { sep: true },
    { label: 'Back', action: function(){ showToast('No history','error'); } },
    { label: 'Forward', action: function(){ showToast('No history','error'); } }
  ],
  Run: [
    { label: 'Run Active File', shortcut: 'Ctrl+Enter', action: runActiveFile },
    { sep: true },
    { label: 'New File to Run', action: function(){ createNewFile(); } }
  ],
  Terminal: [
    { label: 'New Terminal', action: function(){ var t=document.getElementById('terminal'); if(t) t.innerHTML=''; log('DevToolbox Terminal [1.0Beta]','success'); buildTermInput(); } },
    { label: 'Clear Terminal', action: function(){ var t=document.getElementById('terminal'); if(t) t.innerHTML=''; buildTermInput(); } },
    { label: 'Kill Terminal', action: function(){ var t=document.getElementById('terminal'); if(t) t.innerHTML=''; log('Terminal killed.','dim'); buildTermInput(); } }
  ],
  Help: [
    { label: 'Welcome', action: function(){ Object.keys(openTabs).forEach(closeTab); } },
    { label: 'Show Commands', action: function(){ runCommand('help'); } },
    { label: 'List Tools', action: function(){ runCommand('ls'); } },
    { sep: true },
    { label: 'About', action: function(){ runCommand('about'); } }
  ]
};

var currentMenu = null;
function closeMenu(){
  currentMenu = null;
  document.querySelectorAll('.menu-item').forEach(function(el){ el.classList.remove('open'); });
  var old = document.getElementById('active-menu'); if(old) old.remove();
}
function openMenuFor(el, name){
  closeMenu();
  currentMenu = name;
  el.classList.add('open');
  var items = MENUS[name]; if(!items) return;
  var dd = document.createElement('div'); dd.className='menu-dropdown'; dd.id='active-menu';
  items.forEach(function(entry){
    if(entry.sep){ var sep=document.createElement('div'); sep.className='menu-sep'; dd.appendChild(sep); return; }
    var r = document.createElement('div'); r.className='menu-entry';
    r.innerHTML = '<span class="me-label">'+entry.label+'</span>' + (entry.shortcut ? '<span class="me-shortcut">'+entry.shortcut+'</span>' : '');
    r.addEventListener('click', function(e){ e.stopPropagation(); closeMenu(); try { entry.action(); } catch(err){ log('Menu error: '+err.message,'error'); } });
    dd.appendChild(r);
  });
  var rect = el.getBoundingClientRect();
  dd.style.left = rect.left + 'px';
  dd.style.top = rect.bottom + 'px';
  document.body.appendChild(dd);
}
function initMenus(){
  document.querySelectorAll('.menu-item').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var name = el.dataset.menu;
      if(currentMenu === name) closeMenu();
      else openMenuFor(el, name);
    });
    el.addEventListener('mouseenter', function(){
      if(currentMenu && currentMenu !== el.dataset.menu) openMenuFor(el, el.dataset.menu);
    });
  });
  document.addEventListener('click', closeMenu);
  window.addEventListener('blur', closeMenu);
}

/* ─── shortcuts ─── */
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'p'){ e.preventDefault(); showCommandPalette(); return; }
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'p'){ e.preventDefault(); showQuickOpen(); return; }
  if((e.ctrlKey||e.metaKey) && e.key === '`'){ e.preventDefault(); panel.classList.toggle('hidden'); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'n'){ e.preventDefault(); createNewFile(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveActiveFile(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'w'){ e.preventDefault(); if(activeId) closeTab(activeId); return; }
});

/* ─── boot ─── */
function boot(){
  try {
    buildExplorer();
    showWelcome();
    initMenus();
    log('DevToolbox Terminal [1.0Beta]', 'success');
    log('Type "help" for commands.', 'dim');
    log('Ctrl+N = New File  |  Ctrl+Enter = Run code', 'dim');
    buildTermInput();
    log('', 'dim');
    var js = document.getElementById('jsStatus');
    if(js){ js.textContent='JS: ✓ OK'; js.style.background='#10b981'; }
    console.log('[DevToolbox] ✓ 1.0Beta booted');
  } catch(err){ showError('Boot error: '+err.message); console.error(err); }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
